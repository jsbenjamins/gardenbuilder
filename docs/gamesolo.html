  <script>
    let foutopspoor = false;
    let version = '2.2.1' // solo first version 
    // determine whether touch screen device is present
    const isMobileUI = window.matchMedia('(pointer: coarse)').matches;

    function isCompactLayout() {
        return window.matchMedia("(max-width: 900px)").matches;
    }
    window.addEventListener('load', () => { fitStageToContainer(); });
    window.addEventListener('resize', () => { fitStageToContainer(); });

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fitStageToContainer);
    }

    const fade = document.getElementById("scroll-fade");

    function updateScrollFade() {
        const atBottom =
            window.innerHeight + window.scrollY >=
            document.body.scrollHeight - 2;

        fade.style.opacity = atBottom ? "0" : "1";
    }

    window.addEventListener("scroll", updateScrollFade);
    window.addEventListener("resize", updateScrollFade);


    let mobileTouchStart = null;
    let mobileTouchCurrent = null;
    let mobileDragging = false;
    let touchStartPixel = null;

    const botScript = [

        { time:  4000, action: "place", type: "tree2", x: 5,  y: 5 },

        { time:  9000, action: "place", type: "tree1", x: 8,  y: 6 },

        { time: 14000, action: "place", type: "bush3", x: 6,  y: 9 },

        { time: 20000, action: "path", startX: 5, startY: 11, endX: 10, endY: 11 },

        { time: 23000, action: "path", startX: 10, startY: 11, endX: 10, endY: 16 },

        { time: 25000, action: "path", startX: 10, startY: 11, endX: 10, endY: 7 },

        { time: 27000, action: "place", type: "fun12", x: 6,  y: 8 },      // swing

        { time: 34000, action: "place", type: "flbed2", x: 11,  y: 6 },

        { time: 41000, action: "place", type: "bush1", x: 11, y: 10 },

        { time: 47000, action: "place", type: "rot1", x: 8,  y: 12 },      // bench facing path

        { time: 54000, action: "place", type: "tree3", x: 14, y: 4 },

        { time: 59000, action: "place", type: "fun7", x: 12, y: 8 }        // fountain

    ];
    let botScriptIndex = 0;
    let gameStartTime = null;

    const GRID_SIZE = 25;
    const MAX_PATH_LENGTH = 6;
    const CELL_SIZE = 32;
    const width = GRID_SIZE * CELL_SIZE;
    const height = GRID_SIZE * CELL_SIZE;
    
    let currentTurn = 'human'; // 'human' | 'bot'
    let turnNumber = 1;

    let gameEnded = false;

    const GAME_DURATION_SECONDS = 300; // 300 for real
    let remainingSeconds = GAME_DURATION_SECONDS;

    const selectedAvatar = localStorage.getItem('playerAvatar');
    const otherAvatar = localStorage.getItem('otherAvatar');

    const TURN_DELAY_MIN = 2000;
    const TURN_DELAY_MAX = 5000;

    let currentMusic = null;
    let musicEnabled = true;
    let musicUnlocked = false;
    let currentMusicKey = 'bg1';

    const musicTracks = {
      bg1: 'assets/music/bg1.mp3',
      bg2: 'assets/music/bg2.mp3',
      bg3: 'assets/music/bg3.mp3',

      done1: 'assets/music/done1.mp3',
      done2: 'assets/music/done2.mp3',
      done3: 'assets/music/done3.mp3'
    };

    const grassTiles = [
      'assets/grass1.png',
      'assets/grass2.png',
      'assets/grass3.png',
      'assets/grass4.png'
    ];

    const stage = new Konva.Stage({
      container: 'stage-container',
      width,
      height
    });

    function fitStageToContainer() {

      requestAnimationFrame(() => {

        const container = document.getElementById('stage-container');

        const availableWidth = container.clientWidth;
        const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        const availableHeight = Math.min(
            container.clientHeight,
            viewportHeight
        );

        const scale = Math.min(
          availableHeight /height,
          availableWidth / width
        );

        stage.scale({
          x: scale,
          y: scale
        });

        stage.width(width * scale);
        stage.height(height * scale);

        if (!gameEnded) {
          botStage.scale({
            x: scale * 0.5,
            y: scale * 0.5
          });

          botStage.width(width * scale * 0.5);
          botStage.height(height * scale * 0.5);
        } else {
          if (!isCompactLayout) {
            botStage.scale({
              x: scale * 0.5,
              y: scale * 0.5
            });

            botStage.width(width * scale * 0.5);
            botStage.height(height * scale * 0.5);
          } else {
            botStage.scale({
              x: scale,
              y: scale
            });

            botStage.width(width * scale);
            botStage.height(height * scale);
            }
        }
        

        if (foutopspoor) {
          const rect = stage.container().getBoundingClientRect();
          const canvas = stage.container().querySelector("canvas");
          document.getElementById('debug-panel').innerHTML = `
            containerHeight=${container.clientHeight}<br>
            stageRectHeight=${rect.height}<br>
            stageHeight=${stage.height()}<br>
            stageScale=${stage.scaleX()}<br>
            canvasWidth=${canvas.clientWidth}<br>
            canvasHeight=${canvas.clientHeight}
          `;
        }

        updateScrollFade();
      });
    }

    const grassLayer = new Konva.Layer();
    const ownershipLayer = new Konva.Layer();
    const highlightLayer = new Konva.Layer();
    const itemLayer = new Konva.Layer();
    const cursorLayer = new Konva.Layer();

    stage.add(grassLayer);
    stage.add(ownershipLayer);
    stage.add(highlightLayer);
    stage.add(itemLayer);
    stage.add(cursorLayer);

    const previewRect = new Konva.Rect({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      fill: 'green',
      opacity: 0.3,
      visible: false,
      listening: false
    });

    // human highlight last item
    const humanHighlight = new Konva.Rect({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      fill: 'rgb(255,187,0)',
      opacity: 0.35,
      visible: false,
      listening: false
    });

      
    highlightLayer.add(humanHighlight);
    highlightLayer.add(previewRect);

    const botStage = new Konva.Stage({
      container: 'bot-stage-container',
      width,
      height
    });

    const botGrassLayer = new Konva.Layer();
    const botOwnershipLayer = new Konva.Layer();
    const botHighlightLayer = new Konva.Layer();
    const botItemLayer = new Konva.Layer();
    const botCursorLayer = new Konva.Layer();

    botStage.add(botGrassLayer);
    botStage.add(botOwnershipLayer);
    botStage.add(botHighlightLayer);
    botStage.add(botItemLayer);
    botStage.add(botCursorLayer);

    // bot highlight last item
    const botHighlight = new Konva.Rect({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      fill: 'blue',
      opacity: 0.30,
      visible: false,
      listening: false
    });
    botHighlightLayer.add(botHighlight);

    let botPlacedSprites = [];
    let botPathTiles = {};
    let botPathSections = [];

    // BOT stuff
    const BOT_FOLLOW_CHANCE = 0.8;

    const BOT_IMPERFECT_CHANCE = 0.20;

    // imperfect bot stays local
    const BOT_LOCAL_RADIUS = 5;

    // sometimes intentionally choose a weaker option
    const BOT_GOOD_ENOUGH_VARIATION = 0.35;

    let lastHumanAction = null; // { type, x, y }
    let placedSprites = [];     // track placements 

    // set HUMAN into start mode
    let selectedType = null;
    let selectedTool = 'pick';
    let lastTurnWasRecent = false; // path drawing behavior
    const placedUniqueFun = new Set(); // keep track of already placed fun items

    const BOT_SYMMETRY_STRENGTH = 0.08; // 0 → off, 2 → very strong

    // human cursor
    const humanCursor = new Konva.Image({
      width: CELL_SIZE,
      height: CELL_SIZE,
      visible: false,
      listening: false
    });

    const humanPlaceImg = new Image();
    humanPlaceImg.src = 'assets/human-place.png';
    humanPlaceImg.onload = () => {
      humanCursor.image(humanPlaceImg);
    };
  
    const humanDeleteImg = new Image();
    humanDeleteImg.src = 'assets/human-erase.png';
    humanDeleteImg.onload = () => {
      humanCursor.image(humanPlaceImg);
    };

    cursorLayer.add(humanCursor);

    // bot cursor
    const botPlaceCursor = new Konva.Image({
      x: 0,
      y: 0,
      opacity: 1,
      visible: false
    });

    const botDeleteCursor = new Konva.Image({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      opacity: 1,
      visible: false
    });

    const centerX = Math.floor(GRID_SIZE / 2) * CELL_SIZE;
    const centerY = Math.floor(GRID_SIZE / 2) * CELL_SIZE;

    botPlaceCursor.x(centerX);
    botPlaceCursor.y(centerY);

    botDeleteCursor.x(centerX);
    botDeleteCursor.y(centerY);

    let botPlaceReady = false;

    const botPlaceImg = new Image();
    botPlaceImg.src = 'assets/bot-place.png';
    botPlaceImg.onload = () => {
      botPlaceCursor.image(botPlaceImg);
      botPlaceReady = true;
    };

    const botDeleteImg = new Image();
    botDeleteImg.src = 'assets/bot-erase.png';
    botDeleteImg.onload = () => {
      botDeleteCursor.image(botDeleteImg);
    };

    botCursorLayer.add(botPlaceCursor);
    botCursorLayer.add(botDeleteCursor);

    // completion badge in cursor layer
    const completeBadgeImg = new Image();
    completeBadgeImg.src = 'assets/completethisbadge.png';  

    // set bot to not busy at start
    let botBusy = false;
  
    const spriteImages = {
      tree1: 'assets/tree1.png',
      tree2: 'assets/tree2.png',
      tree3: 'assets/tree3.png',

      bush1: 'assets/bush1.png',
      bush2: 'assets/bush2.png',
      bush3: 'assets/bush3.png',
      
      flbed1: 'assets/bluefl.png',
      flbed2: 'assets/redfl.png',
      flbed3: 'assets/yellowfl.png',

      fun1: 'assets/funel/bcourt2.png',
      // fun1_done: 'assets/funel/bcourt2.png',
      fun2: 'assets/funel/cartE.png',
      fun3: 'assets/funel/cartW.png',
      fun4: 'assets/funel/ccourt.png',
      fun5: 'assets/funel/chess2.png',
      // fun5_done: 'assets/funel/chess2.png',
      fun6: 'assets/funel/dpond.png',
      fun7: 'assets/funel/fountain.png',
      fun8: 'assets/funel/hpipe2.png',
      // fun8_done: 'assets/funel/hpipe2.png',
      fun9: 'assets/funel/pzoo2.png',
      // fun9_done: 'assets/funel/pzoo2.png',
      fun10: 'assets/funel/soccer.png',
      fun11: 'assets/funel/statue.png',
      fun12: 'assets/funel/swing.png',
      fun13: 'assets/funel/wip.png',
      fun14: 'assets/funel/slideE.png',
      fun15: 'assets/funel/slideW.png',

      rot1: 'assets/funel/benchN.png',
      rot2: 'assets/funel/benchE.png',
      rot3: 'assets/funel/benchS.png',
      rot4: 'assets/funel/benchW.png',
    };

    // Multi-tile size and category definitions (1 = trees, 2 = bushes, to be extended later)
    const spriteSizes = {
      tree1: { w: 2, h: 2, c: 1},
      tree2: { w: 2, h: 2, c: 1},
      tree3: { w: 2, h: 3, c: 1},

      bush1: { w: 1, h: 1, c: 2},
      bush2: { w: 1, h: 1, c: 2},
      bush3: { w: 1, h: 1, c: 2 },

      flbed1: { w: 2, h: 2, c: 3},
      flbed2: { w: 2, h: 2, c: 3},
      flbed3: { w: 2, h: 2, c: 3 },
         
      // fun1: { w: 4, h: 6, c: 9 , completesTo: 'fun1_done' },
      fun1: { w: 4, h: 6, c: 4 },
      fun2: { w: 3, h: 3, c: 4 },
      fun3: { w: 3, h: 3, c: 4 },
      fun4: { w: 8, h: 6, c: 4 },
      // fun5: { w: 3, h: 3, c: 9, completesTo: 'fun5_done' },
      fun5: { w: 3, h: 3, c: 4 },
      fun6: { w: 4, h: 3, c: 4 },
      fun7: { w: 2, h: 2, c: 4 },
      // fun8: { w: 5, h: 4, c: 9, completesTo: 'fun8_done' },
      fun8: { w: 5, h: 4, c: 4 },
      // fun9: { w: 6, h: 4, c: 9, completesTo: 'fun9_done' },
      fun9: { w: 6, h: 4, c: 4 },
      fun10: { w: 15, h: 8, c: 4 },
      fun11: { w: 1, h: 2, c: 4 },
      fun12: { w: 3, h: 3, c: 4 },
      fun13: { w: 3, h: 2, c: 4 },
      fun14: { w: 3, h: 3, c: 4 },
      fun15: { w: 3, h: 3, c: 4 },

      rot1: { w: 2, h: 1, c: 5 },
      rot2: { w: 1, h: 2, c: 5 },
      rot3: { w: 2, h: 1, c: 5 },
      rot4: { w: 1, h: 2, c: 5 },
      

      path: { w: 1, h: 1, c: 6 },
    };

    const spriteNames = {
      tree1: "Naaldboom",
      tree2: "Loofboom",
      tree3: "Fruitboom",

      bush1: "Struik blauw",
      bush2: "Struik oranje",
      bush3: "Struik groen",

      flbed1: "Blauw bloemenperk",
      flbed2: "Rood bloemenperk",
      flbed3: "Geel bloemenperk",
         
      fun1: "Basketbalveld",
      fun2: "Foodtruck",
      fun3: "Ijstruck",
      fun4: "Koffietent",
      fun5: "Schaaktafel",
      fun6: "Eendenvijver",
      fun7: "Fontein",
      fun8: "Half-pipe",
      fun9: "Kinderboerderij",
      fun10: "Voetbalveld",
      fun11: "Standbeeld",
      fun12: "Schommel",
      fun13: "Wip-wap",
      fun14: "?",
      fun15: "Glijbaan",

      rot1: "Bankje (N)",
      rot2: "Bankje (O)",
      rot3: "Bankje (Z)",
      rot4: "Bankje (W)",
      

      path: "Zandpad",
    }

    function addBotFeedItem(type) {
        const feed = document.getElementById("bot-feed");
        feed.innerText = '';
        feed.innerText = 'Andere speler bouwt: ' + spriteNames[type];
    }

    const tooltip = document.getElementById('tooltip');

    // item tooltips and selection
    document.querySelectorAll('.item').forEach(el => {
      if (!isMobileUI) {
        el.addEventListener('mouseenter', () => {
          tooltip.innerText = el.dataset.name || el.dataset.type;
          tooltip.style.opacity = '1';
        });

        el.addEventListener('mousemove', (e) => {
          tooltip.style.left = (e.clientX + 14) + 'px';
          tooltip.style.top = (e.clientY + 14) + 'px';
        });

        el.addEventListener('mouseleave', () => {
          tooltip.style.opacity = '0';
        });
      }
      el.addEventListener('click', () => {
        clearSelectedUIitem();
        el.classList.remove('bot-selected');
        el.classList.add('selected');
        selectedType = el.dataset.type;
        selectedTool = el.dataset.tool;
        if (isMobileUI) {
          document.getElementById('selected-item-label').innerText =
            el.dataset.name || '';
        }
        updateCursor();
      });
    });

    // tool tooltips and selection
    document.querySelectorAll('.tool').forEach(el => {
      if (!isMobileUI) {
        el.addEventListener('mouseenter', () => {
          tooltip.innerText = el.dataset.name;
          tooltip.style.opacity = '1';
        });

        el.addEventListener('mousemove', (e) => {
          tooltip.style.left = (e.clientX + 14) + 'px';
          tooltip.style.top = (e.clientY + 14) + 'px';
        });

        el.addEventListener('mouseleave', () => {
          tooltip.style.opacity = '0';
        });
      }
      el.addEventListener('click', () => {
        clearSelectedUItool();

    // AUDIO player stuff
    function fadeAudio(audio, targetVolume, duration = 1200, onComplete) {
      const startVolume = audio.volume;
      const steps = 30;
      const stepTime = duration / steps;
      let i = 0;

      const delta = (targetVolume - startVolume) / steps;

      const interval = setInterval(() => {
        i++;
        audio.volume = Math.max(0, Math.min(1, audio.volume + delta));

        if (i >= steps) {
          clearInterval(interval);
          audio.volume = targetVolume;
          if (onComplete) onComplete();
        }
      }, stepTime);
    }

    function playMusic(trackKey, { fadeIn = true } = {}) {
      // audio.muted = !musicEnabled;

      musicUnlocked = true;
      currentMusicKey = trackKey;

      // stop previous music cleanly
      if (currentMusic) {
        const old = currentMusic;

        fadeAudio(old, 0, 400, () => {
          old.pause();
          old.currentTime = 0;
        });
      }

      const audio = new Audio(musicTracks[trackKey]);
      audio.loop = true;
      audio.volume = 0;
      audio.muted = !musicEnabled;

      currentMusic = audio;

      const playPromise = audio.play();

      if (playPromise) {
        playPromise.catch(err => {
          console.log("Audio blocked:", err);
        });
      }

      const targetVolume = musicEnabled ? 0.5 : 0;

      if (fadeIn) {
        fadeAudio(audio, targetVolume, 1200);
      } else {
        audio.volume = targetVolume;
      }
    }

    function createPathSection(startX, startY, endX, endY, owner='human') {

      const ownershipLayerTarget = owner === 'bot' ? botOwnershipLayer : ownershipLayer;
      const pathTilesTarget = owner === 'bot' ? botPathTiles : pathTiles;
      const placedSpritesTarget = owner === 'bot' ? botPlacedSprites : placedSprites;

      // ---------- ONLY STRAIGHT LINES
      if (startX !== endX && startY !== endY) {
        return false;
      }

      // ---------- COMPUTE RECT
      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);

      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);

      // ---------- GRID BOUNDS
      if (
        minX < 0 ||
        minY < 0 ||
        maxX >= GRID_SIZE ||
        maxY >= GRID_SIZE
      ) {
        return false;
      }

      // ---------- LENGTH CHECK
      const length =
        startX === endX
          ? Math.abs(endY - startY) + 1
          : Math.abs(endX - startX) + 1;

      // minimum 2, maximum 6
      if (length < 2 || length > MAX_PATH_LENGTH) {
        return false;
      }

      const horizontal = startY === endY;

      const tiles = [];

      // ---------- VALIDATE TILES
      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {

          // ---------- BLOCK OBJECTS
          const blocked = placedSpritesTarget.some(p =>
            x < p.x + p.w &&
            x + 1 > p.x &&
            y < p.y + p.h &&
            y + 1 > p.y
          );

          if (blocked) return false;

          // ---------- PATH OVERLAP RULES
          const overlapsExisting = pathTilesTarget[key(x,y)];

          if (overlapsExisting) {

            // horizontal section
            if (horizontal) {

              const left = pathTilesTarget[key(x-1,y)];
              const right = pathTilesTarget[key(x+1,y)];

              // already horizontal path here
              if (left && right) {
                return false;
              }

            // vertical section
            } else {

              const up = pathTilesTarget[key(x,y-1)];
              const down = pathTilesTarget[key(x,y+1)];

              // already vertical path here
              if (up && down) {
                return false;
              }
            }
          }

          // ---------- PREVENT PARALLEL ADJACENT LANES
          if (!overlapsExisting) {

            if (horizontal) {

              const above = pathTilesTarget[key(x, y - 1)];
              const below = pathTilesTarget[key(x, y + 1)];

              // avoid horizontal lane beside horizontal lane
              if (
                (above && (above.connections.E || above.connections.W)) ||
                (below && (below.connections.E || below.connections.W))
              ) {
                return false;
              }

            } else {

              const left = pathTilesTarget[key(x - 1, y)];
              const right = pathTilesTarget[key(x + 1, y)];

              // avoid vertical lane beside vertical lane
              if (
                (left && (left.connections.N || left.connections.S)) ||
                (right && (right.connections.N || right.connections.S))
              ) {
                return false;
              }
            }
          }

          tiles.push({x,y});
        }
      }

      // ---------- OWNERSHIP RECTANGLE
      const bg = new Konva.Rect({
        x: minX * CELL_SIZE,
        y: minY * CELL_SIZE,
        width: (maxX - minX + 1) * CELL_SIZE,
        height: (maxY - minY + 1) * CELL_SIZE,
        fill: owner === 'human' ? 'orange' : 'blue',
        opacity: 0.2,
        listening: false
      });

      ownershipLayerTarget.add(bg);

      // ---------- CREATE / INCREMENT PATHS
      tiles.forEach(({x,y}) => {

        const k = key(x,y);

        if (!pathTilesTarget[k]) {

          pathTilesTarget[k] = {
            sprite: null,
            connections: {N:false,E:false,S:false,W:false},
            refs: 0
          };
        }

        pathTilesTarget[k].refs++;
      });

      // ---------- REBUILD CONNECTIONS
      recomputeAllPaths(owner);

      // ---------- STORE SECTION
      pathSections.push({
        owner,
        startX,
        startY,
        endX,
        endY,
        tiles,
        bg
      });

      // ---------- TRACK LAST ACTION
      lastHumanAction = {
        type: 'path',
        startX,
        startY,
        endX,
        endY
      };

      itemLayer.draw();
      ownershipLayer.draw();

      return true;
    }

    function deletePathSection(gridX, gridY, isBot=false) {

      const sectionIndex = pathSections.findIndex(section =>
        section.tiles.some(t => t.x === gridX && t.y === gridY)
      );

      if (sectionIndex === -1) return;

      const section = pathSections[sectionIndex];

      section.tiles.forEach(({x,y}) => {

        if (!pathTiles[k]) return;

        pathTiles[k].refs--;

        if (pathTiles[k].refs <= 0) {

          if (pathTiles[k].sprite) {
            pathTiles[k].sprite.destroy();
          }

          delete pathTiles[k];
        }
      });

      section.bg.destroy();

      pathSections.splice(sectionIndex, 1);

      recomputeAllPaths();

      lastHumanAction = {

        x: gridX,
        y: gridY

    function getConnections(x, y, owner = 'human') {

      return (
        pathTilesTarget[key(x, y)]?.connections || { N:false, E:false, S:false, W:false }

    // getconnections still used?
    function getConnectedPathTiles(startX, startY) {
      const visited = new Set();
      const stack = [[startX, startY]];
      const result = [];

      while (stack.length) {
        const [x, y] = stack.pop();
        const k = key(x, y);

        if (visited.has(k)) continue;
        if (!pathTiles[k]) continue;

        visited.add(k);
        result.push([x, y]);

        const neighbors = [
          [x+1,y], [x-1,y],
          [x,y+1], [x,y-1]
        ];

        neighbors.forEach(([nx, ny]) => {
          if (!visited.has(key(nx, ny))) {
            stack.push([nx, ny]);
          }
        });
      }

      return result;
    }

    function connectionsToTile(conn) {
      const {N,E,S,W} = conn;

      const map = {
        "0000": "closedA",
        "1000": "openN",
        "0010": "openS",
        "0100": "openE",
        "0001": "openW",
        "1010": "openNS",
        "0101": "openWE",
        "0110": "openSE",
        "1100": "openNE",
        "0011": "openSW",
        "1001": "openNW",
        "1110": "openNSE",
        "1011": "openNSW",
        "0111": "openSWE",
        "1101": "openNWE",
        "1111": "openA"
      };

      const keyStr = `${+N}${+E}${+S}${+W}`;
      return map[keyStr] || "closedA";
    }

    function recomputeAllPaths(owner = 'human') {
      const pathTilesTarget = owner === 'bot' ? botPathTiles : pathTiles;

      // 1. reset all connections
      Object.keys(pathTilesTarget).forEach(k => {
          pathTilesTarget[k].connections = { N:false, E:false, S:false, W:false };
      });

      // 2. rebuild connections
      Object.keys(pathTilesTarget).forEach(k => {
          const [x, y] = k.split('-').map(Number);
          const conn = pathTilesTarget[k].connections;

          const dirs = [
              { dx:0, dy:-1, d:"N" },
              { dx:1, dy:0, d:"E" },
              { dx:0, dy:1, d:"S" },
              { dx:-1, dy:0, d:"W" }
          ];

          dirs.forEach(({dx,dy,d}) => {
              if (pathTilesTarget[key(x+dx, y+dy)]) {
                  conn[d] = true;
              }
          });
      });

      // 3. redraw everything
      Object.keys(pathTilesTarget).forEach(k => {
          const [x, y] = k.split('-').map(Number);
          drawPathTile(x, y, owner);
      });
    }

        let tile = pathTilesTarget[key(x,y)]?.sprite;

        if (!tile) {

          tile = new Konva.Image({
            x: x * CELL_SIZE,
            y: y * CELL_SIZE,
            width: CELL_SIZE,
            height: CELL_SIZE,
          });

          itemLayerTarget.add(tile);

          pathTilesTarget[key(x,y)].sprite = tile;
        }

        tile.image(img);
        itemLayerTarget.draw();
      };
    }

    // another path check that prevents suqare creation
    function createsSquare(x, y) {
      const exists = (px, py) => !!pathTiles[key(px, py)];

      // check all 2x2 squares this tile could be part of
      const squares = [
        [ [x,y], [x+1,y], [x,y+1], [x+1,y+1] ],
        [ [x,y], [x-1,y], [x,y+1], [x-1,y+1] ],
        [ [x,y], [x+1,y], [x,y-1], [x+1,y-1] ],
        [ [x,y], [x-1,y], [x,y-1], [x-1,y-1] ],
      ];

      for (const square of squares) {
        let count = 0;

        square.forEach(([sx, sy]) => {
          if ((sx === x && sy === y) || exists(sx, sy)) {
            count++;
          }
        });

        // if all 4 tiles would exist → square
        if (count === 4) return true;
      }

      return false;
    }

    function isPathEndpoint(x, y) {
      const conn = getConnections(x, y);

      const count =
        (conn.N ? 1 : 0) +
        (conn.E ? 1 : 0) +
        (conn.S ? 1 : 0) +
        (conn.W ? 1 : 0);

      return count === 1;
    }

    function getBenchCandidatesNearPath(x, y) {
      const conn = getConnections(x, y);
      const candidates = [];

      const horizontal = conn.E || conn.W;
      const vertical   = conn.N || conn.S;

      // East-West path
      if (horizontal) {

        // bench below path
        candidates.push({
          type: 'rot1', // benchN
          x,
          y: y + 1
        });

        // bench above path
        candidates.push({
          type: 'rot3', // benchS
          x,
          y: y - 1
        });
      }

      // North-South path
      if (vertical) {

        // bench right of path
        candidates.push({
          type: 'rot4', // benchW
          x: x + 1,
          y
        });

        // bench left of path
        candidates.push({
          type: 'rot2', // benchE
          x: x - 1,
          y
        });
      }

      return candidates;
    }

    // ------------------ END PATH SYSTEM ----------

    function canPlace(type, x, y) {
      const s = spriteSizes[type];

      // bounds check
      if (x < 0 || y < 0 || x + s.w > GRID_SIZE || y + s.h > GRID_SIZE) {
        return false;
      }

      // prevent placing on path tiles
      for (let px = x; px < x + s.w; px++) {
        for (let py = y; py < y + s.h; py++) {
          if (pathTiles[key(px, py)]) {
            return false;
          }
        }
      }

      // overlap check
      for (const p of placedSprites) {
        const overlap =
          x < p.x + p.w &&
          x + s.w > p.x &&
          y < p.y + p.h &&
          y + s.h > p.y;

        if (!overlap) continue;

        if (type === 'path' && p.type === 'path') continue;

        return false;
      }

      return true;
    }

    // for BOT determine position scores when following
    function scorePosition(type, x, y, humanX, humanY) {
      let score = 0;

      const category = spriteSizes[type].c;

      // ---------- 1. SYMMETRY (strong weight)
      const centerX = Math.floor(GRID_SIZE / 2);
      const centerY = Math.floor(GRID_SIZE / 2);

      const dx = humanX - centerX;
      const dy = humanY - centerY;

      const sx = centerX - dx;
      const sy = centerY - dy;

      const distToSymmetry = Math.abs(x - sx) + Math.abs(y - sy);

      // score += Math.max(0, 20 - distToSymmetry * 5); // strong pull
      score += BOT_SYMMETRY_STRENGTH * Math.max(0, 20 - distToSymmetry * 5);


      // ---------- 2. CLUSTERING (same category neighbors)
      let neighbors = 0;

      for (const p of placedSprites) {
        if (spriteSizes[p.type].c !== category) continue;

        const dist = Math.abs(x - p.x) + Math.abs(y - p.y);
        if (dist <= 2) neighbors++;
      }

      score += neighbors * 4;


      // ---------- 3. DISTANCE TO HUMAN (soft preference)
      const distToHuman = Math.abs(x - humanX) + Math.abs(y - humanY);
      score += Math.max(0, 10 - distToHuman);


      return score;
    }

    // for BOT to find best scoring position when following
    function findBestPosition(type, originX, originY) {
      let best = null;
      let bestScore = -Infinity;

      // search area (local but wide enough)
      for (let dx = -4; dx <= 4; dx++) {
        for (let dy = -4; dy <= 4; dy++) {
          const x = originX + dx;
          const y = originY + dy;

          if (!canPlace(type, x, y)) continue;

          const score = scorePosition(type, x, y, originX, originY);

          if (score > bestScore) {
            bestScore = score;
            best = { x, y };
          }
        }
      }

      return best;
    }

    // for BOT to find good enough position when being imperfect
    function findGoodEnoughPosition(type, originX, originY) {
      const candidates = [];

      for (let dx = -BOT_LOCAL_RADIUS; dx <= BOT_LOCAL_RADIUS; dx++) {
        for (let dy = -BOT_LOCAL_RADIUS; dy <= BOT_LOCAL_RADIUS; dy++) {

          const x = originX + dx;
          const y = originY + dy;

          if (!canPlace(type, x, y)) continue;

          const score = scorePosition(
            type,
            x,
            y,
            originX,
            originY
          );

          candidates.push({ x, y, score });
        }
      }

      if (!candidates.length) return null;

      // sort best → worst
      candidates.sort((a, b) => b.score - a.score);

      const bestScore = candidates[0].score;

      // keep positions close to best
      const acceptable = candidates.filter(c =>
        c.score >= bestScore * (1 - BOT_GOOD_ENOUGH_VARIATION)
      );

      return acceptable[
        Math.floor(Math.random() * acceptable.length)
      ];
    }

    // ---------- MULTI-TILE PLACEMENT ----------
    function placeSprite(type, gridX, gridY, isBot = false) {
      const itemLayerTarget = isBot ? botItemLayer : itemLayer;
      const cursorLayerTarget = isBot ? botCursorLayer : cursorLayer;
      const placedSpritesTarget = isBot ? botPlacedSprites : placedSprites;

      const cat = spriteSizes[type].c;

      // category 4 restriction (except fun7 + fun11)
      if (cat === 4 && type !== 'fun7' && type !== 'fun11') {
        if (placedUniqueFun.has(type)) return;
      }

      // check whether grid cell is already occupied
      if (!isBot) {
        if (!canPlace(type, gridX, gridY)) return;
      }

      const img = new Image();
      img.src = spriteImages[type];

      img.onload = () => {
        const wat = spriteSizes[type];
        const widthPx = wat.w * CELL_SIZE;
        const heightPx = wat.h * CELL_SIZE;

        const sprite = new Konva.Image({
          id: `cell-${gridX}-${gridY}`,
          x: gridX * CELL_SIZE,
          y: gridY * CELL_SIZE,
          width: widthPx,
          height: heightPx,
          image: img,
          draggable: false,
        });

        sprite.scale({ x: 0.1, y: 0.1 });
        itemLayerTarget.add(sprite);

        sprite.to({
          scaleX: 1,
          scaleY: 1,
          duration: 0.15,
          easing: Konva.Easings.EaseOut
        });

        itemLayerTarget.draw();

        // track placement
        let badge = null;
        if (cat === 9) {

          badge = new Konva.Image({
            image: completeBadgeImg,
            width: 64,
            height: 64,
            // top-right corner of object
            x: (gridX + wat.w) * CELL_SIZE - 32,
            y: gridY * CELL_SIZE - 16,
            listening: false
          });

          cursorLayerTarget.add(badge);

          // gentle floating animation
          badge.to({
            y: badge.y() - 6,
            duration: 0.8,
            yoyo: true,
            repeat: Infinity
          });
        }

        placedSpritesTarget.push({
          type,
          x: gridX,
          y: gridY,
          w: wat.w,
          h: wat.h,
          sprite,
          badge
        });
        cursorLayerTarget.draw();    

        // disable button for fun item after placing, except fountainand statue
        if (!isBot) {
          if (cat === 4 && type !== 'fun7' && type !== 'fun11') {
            placedUniqueFun.add(type);

            const btn = document.querySelector(`[data-type="${type}"]`);
            if (btn) {
              btn.style.opacity = "0.3";
              btn.style.pointerEvents = "none";
            }
          }
        }

        // only track HUMAN actions
        if (!isBot) {
          lastHumanAction = { type, x: gridX, y: gridY };
          //triggerBot();
          endHumanTurn();
          showHighlight('human', gridX, gridY, wat.w, wat.h, false);
        } else {
          showHighlight('bot', gridX, gridY, wat.w, wat.h, true);
        }
      };
    }

    // delete function, anywher on item works
    function deleteSprite(gridX, gridY, isBot = false) {
      // find ANY object covering this tile (not just top-left)
      const index = placedSprites.findIndex(p =>
        gridX >= p.x &&
        gridX < p.x + p.w &&
        gridY >= p.y &&
        gridY < p.y + p.h
      );

      if (index === -1) return;

      const obj = placedSprites[index];
      const type = obj.type;
      const cat = spriteSizes[type].c;

      if (obj.badge) {
        obj.badge.destroy();
        cursorLayer.draw();
      }

      obj.sprite.to({
        scaleX: 0.1,
        scaleY: 0.1,
        duration: 0.15,
        onFinish: () => {
          obj.sprite.destroy();
          itemLayer.draw();
        }
      });

      placedSprites.splice(index, 1);

      // re-enable category 4 button
      if (cat === 4 && type !== 'fun7' && type !== 'fun11') {
        placedUniqueFun.delete(type);

        const btn = document.querySelector(`[data-type="${type}"]`);
        if (btn) {
          btn.style.opacity = "1";
          btn.style.pointerEvents = "auto";
        }
      }

      if (!isBot) {
        lastHumanAction = { delete: true, x: gridX, y: gridY };
        //triggerBot();
        endHumanTurn();
        showHighlight('human', obj.x, obj.y, obj.w, obj.h);
      } else {
        showHighlight('bot', obj.x, obj.y, obj.w, obj.h);
      }
    }

    function completeSprite(obj, completedType) {
      const img = new Image();
      img.src = spriteImages[completedType];

      img.onload = () => {

        // small "upgrade" animation
        obj.sprite.to({
          scaleX: 1.15,
          scaleY: 1.15,
          duration: 0.12,
          onFinish: () => {

            obj.sprite.image(img);

            obj.sprite.to({
              scaleX: 1,
              scaleY: 1,
              duration: 0.12
            });

            itemLayer.draw();
          }
        });

        // update stored type
        if (obj.badge) {
          obj.badge.destroy();
          obj.badge = null;
          cursorLayer.draw();
        }

        // update stored type
        obj.type = completedType;
      };
    }

    // this should not do anything anymore
    function triggerBot() {
      const delayOptions = [300, 450, 800, 1300];
      const delay = delayOptions[Math.floor(Math.random() * delayOptions.length)];

      setTimeout(() => runBot(), delay);
    }

    function runBot() {
      if (botBusy) return;
      console.log(lastHumanAction);
      if (!lastHumanAction || lastHumanAction.delete) return;

      botBusy = true;

      const follow = Math.random() < BOT_FOLLOW_CHANCE;

      if (follow) {
        console.log("following human");
        botFollow();
      } else {
        botImperfect();
      }
    }

    function runBotTurn() {
      if (gameEnded) return;
      if (botBusy) return;

      if (!lastHumanAction) {
        console.log("whoops?");
        endBotTurn();
        return;
      }

      botBusy = true;

      // collaborative completion objects ALWAYS followed
      if (
        lastHumanAction.type &&
        spriteSizes[lastHumanAction.type] &&
        spriteSizes[lastHumanAction.type].c === 9
      ) {
        botFollow();
        return;
      }

      // imperfect branch
      if (Math.random() < BOT_IMPERFECT_CHANCE) {
        botImperfect();
        return;
      }

      // normal logical branch
      botFollow();
    }

    // newer botFollow that acts more intentional (clustering, symmetry, follow and fallback)
    function botFollow() {
      const { type, x, y } = lastHumanAction;

      if (lastHumanAction.type === 'deletePath' | lastHumanAction.delete) {
        botImperfect();
        return;
      }

      if (type === 'path') {
        console.log(type);
        return botFollowPathSection();
      }

      const category = spriteSizes[type].c;

      // ---------- COLLABORATIVE COMPLETION OBJECTS ----------
      if (category === 9) {
        const target = placedSprites.find(p =>
          p.x === x &&
          p.y === y &&
          p.type === type
        );
        if (!target) {
          botBusy = false;
          endBotTurn();
          return;
        }

        const completedType = spriteSizes[type].completesTo;

        return moveBotCursorTo(x, y, 'place', type, () => {
          completeSprite(target, completedType);
          const doneSize = spriteSizes[completedType];
          showHighlight('bot', x, y, doneSize.w, doneSize.h);
        });
      }

      // do NOT follow fun (4) or benches (5)
      if (category === 4 || category === 5) {
        botImperfect();
        // fallback safety (only if botImperfect didn't schedule anything)
        if (botBusy) {
          setTimeout(() => {
            if (botBusy) botBusy = false;
          }, 500);
        }
        return;
      }
      
      // const options = Object.keys(spriteSizes).filter(t => spriteSizes[t].c === category);
      const options = Object.keys(spriteSizes).filter(t =>  spriteSizes[t].c === category &&  !t.endsWith('_done'));
      const botType = options[Math.floor(Math.random() * options.length)];

      const best = findBestPosition(botType, x, y);

      if (best) {
        return moveBotCursorTo(best.x, best.y, 'place', botType, () => {
          placeSprite(botType, best.x, best.y, true);
        });
      }

      // fallback (rare)
      botImperfect();
    }

    // imperfect following instead of random, should also not follow benches!!
    function botImperfect() {
      const { type, x, y } = lastHumanAction;

      // path reactions
      if (type === 'path') {

        // sometimes decorate path instead of extending it
        if (Math.random() < 0.6) {

          const nearbyPaths = Object.keys(pathTiles)
            .map(k => {
              const [px, py] = k.split('-').map(Number);
              return { x: px, y: py };
            })
            .filter(p =>
              Math.abs(p.x - x) <= BOT_LOCAL_RADIUS &&
              Math.abs(p.y - y) <= BOT_LOCAL_RADIUS
            );

          if (nearbyPaths.length) {

            const chosen =
              nearbyPaths[
                Math.floor(Math.random() * nearbyPaths.length)
              ];

            const candidates = getBenchCandidatesNearPath(
              chosen.x,
              chosen.y
            ).filter(c => canPlace(c.type, c.x, c.y));

            if (candidates.length) {

              const bench =
                candidates[
                  Math.floor(Math.random() * candidates.length)
                ];

              return moveBotCursorTo(
                bench.x,
                bench.y,
                'place',
                bench.type,
                () => {
                  placeSprite(
                    bench.type,
                    bench.x,
                    bench.y,
                    true
                  );
                }
              );
            }
          }
        }

        // fallback to normal path behavior
        return botFollowPathSection();
      }

      const category = spriteSizes[type]?.c;

      // collaborative objects should still complete
      if (category === 9) {
        return botFollow();
      }

      // nearby complementary categories
      let candidateTypes = [];

      // nature categories blend together
      if (category === 1 || category === 2 || category === 3) {

        candidateTypes = Object.keys(spriteSizes).filter(t => {

          const c = spriteSizes[t].c;

          return (
            (c === 1 || c === 2 || c === 3) &&
            !t.endsWith('_done')
          );
        });

      } else {
        category = 4; // override it to 4, to prevent imperfect follow of bench.
        // fallback:
        // use same category but imperfect position
        candidateTypes = Object.keys(spriteSizes).filter(t =>
          spriteSizes[t].c === category &&
          !t.endsWith('_done')
        );
      }

      if (!candidateTypes.length) {
        botBusy = false;
        endBotTurn();
        return;
      }

      const chosenType =
        candidateTypes[
          Math.floor(Math.random() * candidateTypes.length)
        ];

      const pos = findGoodEnoughPosition(
        chosenType,
        x,
        y
      );

      if (!pos) {

        // soft fallback:
        // attempt logical follow instead of random
        return botFollow();
      }

      return moveBotCursorTo(
        pos.x,
        pos.y,
        'place',
        chosenType,
        () => {
          placeSprite(
            chosenType,
            pos.x,
            pos.y,
            true
          );
        }
      );
    }

    function botFollowPathSection() {
      if (!pathSections.length) {
        botBusy = false;
        return;
      }

      const last = pathSections[pathSections.length - 1];

      // direction vector of last section
      let dx = 0;
      let dy = 0;

      if (last.startX === last.endX) {
        dy = last.endY > last.startY ? 1 : -1;
      } else {
        dx = last.endX > last.startX ? 1 : -1;
      }

      // choose new length (2–6 tiles)
      const len = Math.floor(Math.random() * (MAX_PATH_LENGTH - 1)) + 2;

      const endpoints = [];

      Object.keys(pathTiles).forEach(k => {
        const [x, y] = k.split('-').map(Number);

        if (isPathEndpoint(x, y)) {
          endpoints.push({x, y});
        }
      });

      // if there are no endpoints to connect to...
      if (!endpoints.length) {
        botImperfect();
        return;
      }

      const chosen = endpoints[Math.floor(Math.random() * endpoints.length)];

      const startX = chosen.x;
      const startY = chosen.y;

      const dir = getEndpointDirection(startX, startY);

      if (!dir) {
        // botBusy = false;
        botImperfect();
        return;
      }

      const endX = startX - dir.dx * len;
      const endY = startY - dir.dy * len;

      // clamp to grid
      const cx = Math.max(0, Math.min(GRID_SIZE - 1, endX));
      const cy = Math.max(0, Math.min(GRID_SIZE - 1, endY));

      if (startX === cx && startY === cy) {
        //botBusy = false;
        botImperfect();
        return;
      }

      moveBotCursorTo(startX, startY, 'place', 'path', () => {
        const success = createPathSection(
          startX,
          startY,
          cx,
          cy,
          'bot'
        );
        if (!success) {
          return botImperfect();
        }
      });
    }

    function moveBotCursorTo(gridX, gridY, mode, type, callback) {
      if (mode === 'place' && !botPlaceReady) {
        // fallback: skip animation but still place
        if (callback) callback();
        botBusy = false;
        return;
      }
      const baseX = gridX * CELL_SIZE;
      const baseY = gridY * CELL_SIZE;

      // hide both first
      botPlaceCursor.visible(false);
      botDeleteCursor.visible(false);

      let cursor;

      if (mode === 'place') {
        botSelectTool('pick');

        if (type) {
          botSelectItem(type);
        }
      }

      if (mode === 'delete') {
        botSelectTool('erase');
      }

      if (mode === 'place') {
        cursor = botPlaceCursor;
      } else {
        cursor = botDeleteCursor;
      }

      // always 1 tile size
      cursor.width(CELL_SIZE);
      cursor.height(CELL_SIZE);

      // ---------- CURRENT POSITION (already initialized to center)
      const startX = cursor.x();
      const startY = cursor.y();

      // ---------- MISALIGNMENT (small offset)
      const offsetX = (Math.random() - 0.5) * 6; // -3 to +3 px
      const offsetY = (Math.random() - 0.5) * 6;

      const targetX = baseX + offsetX;
      const targetY = baseY + offsetY;

      cursor.scale({ x: 1, y: 1 });
      cursor.visible(true);

      // ---------- PRE-MOVE HESITATION ----------
      const preDelay = [80, 120, 160][Math.floor(Math.random() * 3)];

      setTimeout(() => {
        cursor.visible(true);
        // ---------- MOVE (slightly imperfect)
        cursor.to({
          x: targetX,
          y: targetY,
          duration: 0.35,
          easing: Konva.Easings.EaseInOut,
          onFinish: () => {

            // ---------- MICRO CORRECTION (snap into place)
            cursor.to({
              x: baseX,
              y: baseY,
              duration: 0.08,
              onFinish: () => {

                // ---------- HOVER DELAY ----------
                const hoverDelay = [120, 180, 250][Math.floor(Math.random() * 3)];

                setTimeout(() => {

                  // ---------- CLICK ----------
                  cursor.to({
                    scaleX: 0.8,
                    scaleY: 0.8,
                    duration: 0.08,
                    onFinish: () => {
                      cursor.to({
                        scaleX: 1,
                        scaleY: 1,
                        duration: 0.08,
                        onFinish: () => {

                          cursor.visible(false);

                          if (callback) callback();

                          botBusy = false;
                          // endBotTurn();
                        }
                      });
                    }
                  });

                }, hoverDelay);
              }
            });

          }
        });

      }, preDelay);
    }

    // ---------- EVENT DETECTION ----------
    // Must set listening(true) and pointer-events must not be blocked
    grassLayer.listening(true);
    itemLayer.listening(true);
    stage.listening(true);

    // Scaling helper functions
    function getScaledPointer() {

      const pos = stage.getPointerPosition();
      if (!pos) return null;

      const scale = stage.scaleX();

      return {
        x: pos.x / scale,
        y: pos.y / scale
      };
    }

    //
    function getGridPointer() {

      const pos = getScaledPointer();
      if (!pos) return null;

      return {
        x: Math.floor(pos.x / CELL_SIZE),
        y: Math.floor(pos.y / CELL_SIZE)
      };
    }

    // drawing for non-mobile
    stage.on('pointermove', () => {
      if (isMobileUI) return;
      const pos = getScaledPointer();
      if (!pos) return;

      const gridX = Math.floor(pos.x / CELL_SIZE);
      const gridY = Math.floor(pos.y / CELL_SIZE);

      if (!isMobileUI) {
        humanCursor.x(gridX * CELL_SIZE);
        humanCursor.y(gridY * CELL_SIZE);
        humanCursor.visible(true);
      } else {
        humanCursor.visible(false);
      }

      if (selectedTool==='erase'){
        humanCursor.image(humanDeleteImg);
      } else {
        humanCursor.image(humanPlaceImg);
      }

      // Only show for placement (not erase, not bot)
      if (!selectedType || selectedTool === 'erase' || (spriteSizes[selectedType]?.c === 4 && selectedType !== 'fun7' && selectedType !== 'fun11' && placedUniqueFun.has(selectedType))) {
        previewRect.visible(false);
        highlightLayer.draw();
        return;
      }

      // path drawing preview logic
      if (selectedType === 'path' && pathStart) {

        const dx = Math.abs(gridX - pathStart.x);
        const dy = Math.abs(gridY - pathStart.y);

        let previewX = pathStart.x;
        let previewY = pathStart.y;

        let previewW = 1;
        let previewH = 1;

        // horizontal wins
        if (dx >= dy) {
          previewX = Math.min(pathStart.x, gridX);
          // previewW = Math.abs(gridX - pathStart.x) + 1;
          previewW = Math.min(MAX_PATH_LENGTH,Math.abs(gridX - pathStart.x) + 1);
        } else {
          previewY = Math.min(pathStart.y, gridY);
          // previewH = Math.abs(gridY - pathStart.y) + 1;
          previewH = Math.min(MAX_PATH_LENGTH,Math.abs(gridY - pathStart.y) + 1);
        }

        pathPreview.x(previewX * CELL_SIZE);
        pathPreview.y(previewY * CELL_SIZE);

        pathPreview.width(previewW * CELL_SIZE);
        pathPreview.height(previewH * CELL_SIZE);

        pathPreview.visible(true);

        highlightLayer.batchDraw();
      }

      const size = spriteSizes[selectedType] || { w: 1, h: 1 };

      previewRect.x(gridX * CELL_SIZE);
      previewRect.y(gridY * CELL_SIZE);
      previewRect.width(size.w * CELL_SIZE);
      previewRect.height(size.h * CELL_SIZE);

      // validity check
      // const valid = selectedType === 'path' ? !createsSquare(gridX, gridY) : canPlace(selectedType, gridX, gridY);
      const valid = canPlace(selectedType, gridX, gridY);

      previewRect.fill(valid ? 'green' : 'red');
      previewRect.visible(true);

      highlightLayer.batchDraw();
    });

    // placing for non-mobile
    stage.on('pointerdown', () => {
      if (isMobileUI) return;
      if (gameEnded) return;
      // if (!musicUnlocked) {
      //   musicUnlocked = true;
      //   playMusic('bg1', { fadeIn: true });
      // }
      if (currentTurn !== 'human') return;
      previewRect.visible(false);
      const pos = getScaledPointer();
      if (!pos) return;

      const gridX = Math.floor(pos.x / CELL_SIZE);
      const gridY = Math.floor(pos.y / CELL_SIZE);

      if (selectedTool === 'erase') {
        // try deleting path first
        if (pathTiles[key(gridX, gridY)]) {
          deletePathSection(gridX, gridY);
        } else {
          deleteSprite(gridX, gridY);
        }
        return;
      }

      // Tool: pick
      if (selectedTool === 'pick') {
        const existing = itemLayer.findOne(`#cell-${gridX}-${gridY}`);
        if (existing) {
          const src = existing.image().src;
          const type = Object.keys(spriteImages).find(t => spriteImages[t] === src);

          if (type) {
            clearSelectedUIitem();
            document.querySelector(`[data-type="${type}"]`).classList.add('selected');
            selectedType = type;
          }
        }
        return;
      }

      // Placement mode
      if (selectedType === 'path') {
        // first click
        if (!pathStart) {
          pathStart = {x:gridX, y:gridY};
          return;
        }
        let targetX = gridX;
        let targetY = gridY;

        // clamp to max length
        if (pathStart.x === gridX) {

          const dir = Math.sign(gridY - pathStart.y);

          targetY =
            pathStart.y +
            dir * (MAX_PATH_LENGTH - 1);

          if (Math.abs(gridY - pathStart.y) < MAX_PATH_LENGTH) {
            targetY = gridY;
          }

        } else {

          const dir = Math.sign(gridX - pathStart.x);

          targetX =
            pathStart.x +
            dir * (MAX_PATH_LENGTH - 1);

          if (Math.abs(gridX - pathStart.x) < MAX_PATH_LENGTH) {
            targetX = gridX;
          }
        }
                // second click
        const success = createPathSection(
          pathStart.x,
          pathStart.y,
          targetX,
          targetY,
          'human'
        );
        if (success) {
          endHumanTurn();
        }
        pathStart = null;
        pathPreview.visible(false);
        highlightLayer.draw();
        return;
      }

      if (selectedType) {
        console.log("placing elements");
        deleteSprite(gridX, gridY);
        placeSprite(selectedType, gridX, gridY);
      }
    });
    //=========== MOBILE SECTION =================================//
    
    // mobile start
    stage.on('touchstart', () => {
      if (!isMobileUI) return;
      if (gameEnded) return;
      if (currentTurn !== 'human') return;

      const pos = getScaledPointer();
      if (!pos) return;

      touchStartPixel = {
        x: pos.x,
        y: pos.y
      };
      
      const gridX = Math.floor(pos.x / CELL_SIZE);
      const gridY = Math.floor(pos.y / CELL_SIZE);

      mobileTouchStart = { x: gridX, y: gridY };
      mobileTouchCurrent = { x: gridX, y: gridY };
      mobileDragging = false;

      // path remembers start immediately
      if (selectedType === 'path') {
        pathStart = { x: gridX, y: gridY };
      }
    });

    // mobile move
    stage.on('touchmove', () => {
      if (!isMobileUI) return;
      if (!mobileTouchStart) return;

      const pos = getScaledPointer();
      if (!pos) return;

      const dx = pos.x - touchStartPixel.x;
      const dy = pos.y - touchStartPixel.y;

      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > 12) {
        mobileDragging = true;
      }

      const gridX = Math.floor(pos.x / CELL_SIZE);
      const gridY = Math.floor(pos.y / CELL_SIZE);

      mobileTouchCurrent = { x: gridX, y: gridY };
            
      if (selectedType && selectedType !== 'path' && selectedTool !== 'erase') {
        const size = spriteSizes[selectedType] || { w:1, h:1 };

        previewRect.x(gridX * CELL_SIZE);
        previewRect.y(gridY * CELL_SIZE);

        previewRect.width(size.w * CELL_SIZE);
        previewRect.height(size.h * CELL_SIZE);

        previewRect.fill(
          canPlace(selectedType, gridX, gridY)
            ? 'green'
            : 'red'
        );

        previewRect.visible(true);
      }

      if (selectedType === 'path' && pathStart) {

        const dx = Math.abs(gridX - pathStart.x);
        const dy = Math.abs(gridY - pathStart.y);

        let previewX = pathStart.x;
        let previewY = pathStart.y;

        let previewW = 1;
        let previewH = 1;

        if (dx >= dy) {
          previewX = Math.min(pathStart.x, gridX);
          previewW = Math.min(
            MAX_PATH_LENGTH,
            Math.abs(gridX - pathStart.x) + 1
          );
        } else {
          previewY = Math.min(pathStart.y, gridY);
          previewH = Math.min(
            MAX_PATH_LENGTH,
            Math.abs(gridY - pathStart.y) + 1
          );
        }

        pathPreview.x(previewX * CELL_SIZE);
        pathPreview.y(previewY * CELL_SIZE);
        pathPreview.width(previewW * CELL_SIZE);
        pathPreview.height(previewH * CELL_SIZE);

        pathPreview.visible(true);
      }

      highlightLayer.batchDraw();
    });

    // mobile release
    stage.on('touchend', () => {
      if (!isMobileUI) return;
      if (!mobileTouchStart) return;
      if (gameEnded) return;
      if (currentTurn !== 'human') return;

      // -------------------------
      // ERASE MODE
      // -------------------------
      if (selectedTool === 'erase') {

        const x = mobileTouchStart.x;
        const y = mobileTouchStart.y;

        if (pathTiles[key(x, y)]) {
          deletePathSection(x, y);
        } else {
          deleteSprite(x, y);
        }

        previewRect.visible(false);
        pathPreview.visible(false);

        mobileTouchStart = null;
        mobileTouchCurrent = null;
        mobileDragging = false;

        highlightLayer.draw();
        return;
      }

      // -------------------------
      // OBJECT PLACEMENT
      // -------------------------
      if (selectedType && selectedType !== 'path') {

        const x = mobileTouchCurrent
          ? mobileTouchCurrent.x
          : mobileTouchStart.x;

        const y = mobileTouchCurrent
          ? mobileTouchCurrent.y
          : mobileTouchStart.y;
        if (!mobileDragging) {

          mobileTouchStart = null;
          mobileTouchCurrent = null;
          mobileDragging = false;

          previewRect.visible(false);

          highlightLayer.draw();

          return;
        }
        placeSprite(selectedType, x, y);

        previewRect.visible(false);

        mobileTouchStart = null;
        mobileTouchCurrent = null;
        mobileDragging = false;

        highlightLayer.draw();
        return;
      }

      // -------------------------
      // PATH DRAWING
      // -------------------------
      if (selectedType === 'path' && pathStart) {

        const endX = mobileTouchCurrent
          ? mobileTouchCurrent.x
          : mobileTouchStart.x;

        const endY = mobileTouchCurrent
          ? mobileTouchCurrent.y
          : mobileTouchStart.y;

        // same tile = cancel
        if (
          endX === pathStart.x &&
          endY === pathStart.y
        ) {

          pathStart = null;

          pathPreview.visible(false);

          mobileTouchStart = null;
          mobileTouchCurrent = null;
          mobileDragging = false;

          highlightLayer.draw();
          return;
        }

        if (!mobileDragging) {

          pathStart = null;

          mobileTouchStart = null;
          mobileTouchCurrent = null;
          mobileDragging = false;

          pathPreview.visible(false);

          highlightLayer.draw();

          return;
        }

        let targetX = endX;
        let targetY = endY;

        const dx = Math.abs(endX - pathStart.x);
        const dy = Math.abs(endY - pathStart.y);

        // horizontal wins
        if (dx >= dy) {

          targetY = pathStart.y;

          const dir = Math.sign(endX - pathStart.x);

          targetX =
            pathStart.x +
            dir *
            Math.min(MAX_PATH_LENGTH - 1, dx);

        } else {

          targetX = pathStart.x;

          const dir = Math.sign(endY - pathStart.y);

          targetY =
            pathStart.y +
            dir *
            Math.min(MAX_PATH_LENGTH - 1, dy);
        }

        const success = createPathSection(
          pathStart.x,
          pathStart.y,
          targetX,
          targetY,
          'human'
        );
        if (success) {
          endHumanTurn();
        }

        pathStart = null;

        pathPreview.visible(false);

        mobileTouchStart = null;
        mobileTouchCurrent = null;
        mobileDragging = false;

        highlightLayer.draw();
      }
    });


    function updateCursor() {
      const container = document.getElementById('stage-container');

      if (!selectedType || selectedTool === 'erase') {
        previewRect.visible(false);
        highlightLayer.draw();
      }

      if (selectedTool === 'erase') {
        container.style.cursor = "url('assets/cursor-erase-human.png') 16 16, auto";
        console.log("at erase?");
        clearSelectedUIitem();
      } else {
        container.style.cursor = "url('assets/cursor-place-human.png') 16 16, auto";
      }
    }
  </script>
</body>
