<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Park Game UU</title>
  <link rel="stylesheet" type="text/css" href="styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    body { 
      margin: 0; 
      display: flex; 
      height: 100vh;
      background: #e2ffad;
      font-family: "Bitcount", system-ui;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "slnt" 0,
        "CRSV" 0.5,
        "ELSH" 0,
        "ELXP" 0;
    }  
    #sidebar {
      width: 300px;
      background: #e2ffad;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item, .tool {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      font-size: 32px;
    }
    h3 {
      font-weight: 400;
    }
    #beurt {
      padding: 10px;
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 24px;
      box-sizing: border-box;
    }

    #beurt .turn-avatar {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      flex-shrink: 0;
      display: block;
    }

    #beurt .turn-label {
      display: flex;
      align-items: center;
    }
    .selected {
      border: 4px solid;
      border-color: rgb(255, 187, 0);
      /* box-shadow: 0 0 5px #997700; */
    }
    .bot-selected {
      border: 4px solid;
      border-color: #0000ff;
      /* box-shadow: 0 0 8px #000099; */
    }
    .botplayer {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      border: 4px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgb(120, 145, 85);
      font-size: 32px;
      border-color: #0000ff;
      /* box-shadow: 0 0 5px #000099; */
    }
    #tools { display: flex; gap: 5px; }
    #stage-container {
      flex: 1;
      cursor: url('assets/cursor-place-human.png') 16 16, auto;
    }
    #tooltip {
      position: fixed;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 9999;
      white-space: nowrap;
    }

    #game-timer {
      position: fixed;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 28px;
      z-index: 5000;
      letter-spacing: 1px;
    }

    #end-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    #end-box {
      background: linear-gradient(
        135deg,
        #ffe066,
        #ffb703,
        #8ecae6,
        #90be6d
      );
      border-radius: 28px;
      padding: 50px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.35);
      max-width: 700px;
    }

    #end-box h1 {
      margin: 0 0 30px 0;
      font-size: 56px;
      line-height: 1.1;
      color: white;
      text-shadow:
        3px 3px 0 rgba(0,0,0,0.25);
      font-weight: 500;
    }

    #end-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #end-buttons button {
      font-family: "Bitcount", system-ui;
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 24px;
      cursor: pointer;
      background: white;
      color: black;
      transition: transform 0.12s;
    }

    #end-buttons button:hover {
      transform: scale(1.05);
    }

    #end-box {
      animation: endPop 0.5s ease-out;
    }

    @keyframes endPop {
      0% {
        transform: scale(0.6) rotate(-4deg);
        opacity: 0;
      }

      70% {
        transform: scale(1.08) rotate(2deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0deg);
      }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>Jouw tools</h3>
    <div id="tools">
      <div class="tool selected" data-tool="pick" data-name="Bouw/plaats"><img src="assets/cursor-place-human.png" width="60" alt="Bouw/plaats"></div>
      <div class="tool" data-tool="erase" data-name="Verwijder"><img src="assets/cursor-erase-human.png" width="60" alt="Verwijder"></div>
    </div>

    <h3>Wie is aan de beurt?</h3>
    <div id="beurt">
      <span class="turn-label">--</span>
      <img class="turn-avatar" id="playerAvatarImg" src="assets/players/player01.png">
    </div>

    <h3>Elementen</h3>
    <table id="elements-grid" border="0">
      <tbody>
        <tr>
          <td><div class="item" data-type="tree1" data-name="Naaldboom"><img src="assets/tree1.png" width="40" alt="boom 1"></div></td>
          <td><div class="item" data-type="tree2" data-name="Loofboom"><img src="assets/tree2.png" width="40" alt="boom 2"></div></td>
          <td><div class="item" data-type="tree3" data-name="fruitboom"><img src="assets/tree3.png" width="40" alt="boom 3"></div></td>
          <td><div class="item" data-type="fun12" data-name="Schommel"><img src="assets/funelprev/swing.png" width="40" alt="schommel"></div></td>
        </tr>
        <tr>
          <td><div class="item" data-type="bush1" data-name="Struik blauw"><img src="assets/bush1.png" width="40" alt="struik 1"></div></td>
          <td><div class="item" data-type="bush2" data-name="Struik oranje"><img src="assets/bush2.png" width="40" alt="struik 2"></div></td>
          <td><div class="item" data-type="bush3" data-name="Struik groen"><img src="assets/bush3.png" width="40" alt="struik 3"></div></td>
          <td><div class="item" data-type="fun13" data-name="Wip-wap"><img src="assets/funelprev/wip.png" width="40" alt="wipwap"></div></td>
        </tr>
        <tr>
          <td><div class="item" data-type="flbed1" data-name="Blauw bloemenperk"><img src="assets/bluefl.png" width="40" alt="bloem blauw"></div></td>
          <td><div class="item" data-type="flbed2" data-name="Rood bloemenperk"><img src="assets/redfl.png" width="40" alt="bloem rood"></div></td>
          <td><div class="item" data-type="flbed3" data-name="Geel bloemenperk"><img src="assets/yellowfl.png" width="40" alt="bloem geel"></div></td>
          <td><div class="item" data-type="fun15" data-name="Glijbaan"><img src="assets/funelprev/slideW.png" width="40" alt="glijbaan roze"></div></td>

        <tr>
          <td><div class="item" data-type="path" data-name="Zandpad"><img src="assets/funelprev/path.png" width="40" alt="zandpad"></div></td>
          <td><div class="item" data-type="fun7" data-name="Fontein"><img src="assets/funelprev/fountain.png" width="40" alt="fontein"></div></td>
          <td><div class="item" data-type="fun11" data-name="Standbeeld"><img src="assets/funelprev/statue.png" width="40" alt="standbeeld"></div></td>

          <td><div class="item" data-type="rot1" data-name="Bankje (N)"><img src="assets/funelprev/benchN.png" width="40" alt="bankje N"></div></td>
          <td><div class="item" data-type="fun2" data-name="Foodtruck"><img src="assets/funelprev/cartE.png" width="40"  alt="foodtruck 1"></div></td>
          <td><div class="item" data-type="fun8" data-name="Half-pipe"><img src="assets/funelprev/hpipe.png" width="40" alt="halfpipe"></div></td>
        </tr>
        <tr>
          <td><div class="item" data-type="rot3" data-name="Bankje (Z)"><img src="assets/funelprev/benchS.png" width="40" alt="bankje Z"></div></td>
          <td><div class="item" data-type="rot2" data-name="Bankje (O)"><img src="assets/funelprev/benchE.png" width="40" alt="bankje O"></div></td>
          <td><div class="item" data-type="fun3" data-name="Ijstruck"><img src="assets/funelprev/cartW.png" width="40"  alt="foodtruck 2"></div></td>
          <td><div class="item" data-type="fun10" data-name="Voetbalveld"><img src="assets/funelprev/soccer.png" width="40" alt="voetbalveld"></div></td>
        </tr>
        <tr>
          <td><div class="item" data-type="fun9" data-name="Kinderboerderij"><img src="assets/funelprev/pzoo.png" width="40" alt="kinderboerderij"></div></td>
          <td><div class="item" data-type="fun6" data-name="Eendenvijver"><img src="assets/funelprev/dpond.png" width="40"  alt="eendenvijver"></div></td>          
          <td><div class="item" data-type="fun4" data-name="Koffietent"><img src="assets/funelprev/ccourt.png" width="40"  alt="koffietent"></div></td>
          <td><div class="item" data-type="fun1" data-name="Basketbalveld"><img src="assets/funelprev/bcourt.png" width="40"  alt="basketbalveld"></div></td>
        </tr>
      </tbody>
    </table>
    
  </div>

  <div id="game-timer">01:00</div> <!-- 5:00 for real-->

  <div id="end-overlay">
    <div id="end-box">
      <h1>Goed samengewerkt,<br>wat een leuk park!</h1>

      <div id="end-buttons">
        <button id="download-btn">Download je park</button>
        <button id="survey-btn">Ga naar vragenlijst</button>
      </div>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="stage-container"></div>

  <script>
    const GRID_SIZE = 25;
    const MAX_PATH_LENGTH = 6;
    const CELL_SIZE = 32;
    const width = GRID_SIZE * CELL_SIZE;
    const height = GRID_SIZE * CELL_SIZE;
    
    let currentTurn = 'human'; // 'human' | 'bot'
    let turnNumber = 1;

    let gameEnded = false;

    const GAME_DURATION_SECONDS = 60; // 300 for real
    let remainingSeconds = GAME_DURATION_SECONDS;

    const selectedAvatar = localStorage.getItem('playerAvatar');
    const otherAvatar = localStorage.getItem('otherAvatar');

    const TURN_DELAY_MIN = 2000;
    const TURN_DELAY_MAX = 5000;

    const grassTiles = [
      'assets/grass1.png',
      'assets/grass2.png',
      'assets/grass3.png',
      'assets/grass4.png'
    ];

    const stage = new Konva.Stage({
      container: 'stage-container',
      width,
      height
    });

    const grassLayer = new Konva.Layer();
    const ownershipLayer = new Konva.Layer();
    const highlightLayer = new Konva.Layer();
    const itemLayer = new Konva.Layer();
    const cursorLayer = new Konva.Layer();

    stage.add(grassLayer);
    stage.add(ownershipLayer);
    stage.add(highlightLayer);
    stage.add(itemLayer);
    stage.add(cursorLayer);

    const previewRect = new Konva.Rect({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      fill: 'green',
      opacity: 0.3,
      visible: false,
      listening: false
    });

    // human highlight last item
    const humanHighlight = new Konva.Rect({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      fill: 'rgb(255,187,0)',
      opacity: 0.35,
      visible: false,
      listening: false
    });

    // bot highlight last item
    const botHighlight = new Konva.Rect({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      fill: 'blue',
      opacity: 0.30,
      visible: false,
      listening: false
    });
    
    highlightLayer.add(humanHighlight);
    highlightLayer.add(botHighlight);
    highlightLayer.add(previewRect);

    // BOT stuff
    const BOT_FOLLOW_CHANCE = 0.8;

    const BOT_IMPERFECT_CHANCE = 0.20;

    // imperfect bot stays local
    const BOT_LOCAL_RADIUS = 5;

    // sometimes intentionally choose a weaker option
    const BOT_GOOD_ENOUGH_VARIATION = 0.35;

    let lastHumanAction = null; // { type, x, y }
    let placedSprites = [];     // track placements 

    // set HUMAN into start mode
    let selectedType = null;
    let selectedTool = null;
    let lastTurnWasRecent = false; // path drawing behavior
    const placedUniqueFun = new Set(); // keep track of already placed fun items

    const BOT_SYMMETRY_STRENGTH = 0.08; // 0 → off, 2 → very strong

    // bot cursor
    const botPlaceCursor = new Konva.Image({
      x: 0,
      y: 0,
      opacity: 1,
      visible: false
    });

    const botDeleteCursor = new Konva.Image({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      opacity: 1,
      visible: false
    });

    const centerX = Math.floor(GRID_SIZE / 2) * CELL_SIZE;
    const centerY = Math.floor(GRID_SIZE / 2) * CELL_SIZE;

    botPlaceCursor.x(centerX);
    botPlaceCursor.y(centerY);

    botDeleteCursor.x(centerX);
    botDeleteCursor.y(centerY);

    let botPlaceReady = false;

    const botPlaceImg = new Image();
    botPlaceImg.src = 'assets/bot-place.png';
    botPlaceImg.onload = () => {
      botPlaceCursor.image(botPlaceImg);
      botPlaceReady = true;
    };

    const botDeleteImg = new Image();
    botDeleteImg.src = 'assets/bot-erase.png';
    botDeleteImg.onload = () => {
      botDeleteCursor.image(botDeleteImg);
    };

    cursorLayer.add(botPlaceCursor);
    cursorLayer.add(botDeleteCursor);

    // set bot to not busy at start
    let botBusy = false;
  
    const spriteImages = {
      tree1: 'assets/tree1.png',
      tree2: 'assets/tree2.png',
      tree3: 'assets/tree3.png',

      bush1: 'assets/bush1.png',
      bush2: 'assets/bush2.png',
      bush3: 'assets/bush3.png',
      
      flbed1: 'assets/bluefl.png',
      flbed2: 'assets/redfl.png',
      flbed3: 'assets/yellowfl.png',

      fun1: 'assets/funel/bcourt.png',
      fun2: 'assets/funel/cartE.png',
      fun3: 'assets/funel/cartW.png',
      fun4: 'assets/funel/ccourt.png',
      fun5: 'assets/funel/chess1.png',
      fun5_done: 'assets/funel/chess2.png',
      fun6: 'assets/funel/dpond.png',
      fun7: 'assets/funel/fountain.png',
      fun8: 'assets/funel/hpipe1.png',
      fun8_done: 'assets/funel/hpipe2.png',
      fun9: 'assets/funel/pzoo1.png',
      fun9_done: 'assets/funel/pzoo2.png',
      fun10: 'assets/funel/soccer.png',
      fun11: 'assets/funel/statue.png',
      fun12: 'assets/funel/swing.png',
      fun13: 'assets/funel/wip.png',
      fun14: 'assets/funel/slideE.png',
      fun15: 'assets/funel/slideW.png',

      rot1: 'assets/funel/benchN.png',
      rot2: 'assets/funel/benchE.png',
      rot3: 'assets/funel/benchS.png',
      rot4: 'assets/funel/benchW.png',
    };

    // Multi-tile size and category definitions (1 = trees, 2 = bushes, to be extended later)
    const spriteSizes = {
      tree1: { w: 2, h: 2, c: 1},
      tree2: { w: 2, h: 2, c: 1},
      tree3: { w: 2, h: 3, c: 1},

      bush1: { w: 1, h: 1, c: 2},
      bush2: { w: 1, h: 1, c: 2},
      bush3: { w: 1, h: 1, c: 2 },

      flbed1: { w: 2, h: 2, c: 3},
      flbed2: { w: 2, h: 2, c: 3},
      flbed3: { w: 2, h: 2, c: 3 },
         
      fun1: { w: 4, h: 6, c: 4 },
      fun2: { w: 3, h: 3, c: 4 },
      fun3: { w: 3, h: 3, c: 4 },
      fun4: { w: 8, h: 6, c: 4 },
      fun5: { w: 3, h: 3, c: 9, completesTo: 'fun5_done' },
      fun5_done: { w: 3, h: 3, c: 4 },
      fun6: { w: 4, h: 3, c: 4 },
      fun7: { w: 2, h: 2, c: 4 },
      fun8: { w: 5, h: 4, c: 9, completesTo: 'fun8_done' },
      fun8_done: { w: 5, h: 4, c: 4 },
      fun9: { w: 6, h: 4, c: 9, completesTo: 'fun9_done' },
      fun9_done: { w: 6, h: 4, c: 4 },
      fun10: { w: 15, h: 8, c: 4 },
      fun11: { w: 1, h: 2, c: 4 },
      fun12: { w: 3, h: 3, c: 4 },
      fun13: { w: 3, h: 2, c: 4 },
      fun14: { w: 3, h: 3, c: 4 },
      fun15: { w: 3, h: 3, c: 4 },

      rot1: { w: 2, h: 1, c: 5 },
      rot2: { w: 1, h: 2, c: 5 },
      rot3: { w: 2, h: 1, c: 5 },
      rot4: { w: 1, h: 2, c: 5 },
      

      path: { w: 1, h: 1, c: 6 },
    };

    const tooltip = document.getElementById('tooltip');

    // item tooltips
    document.querySelectorAll('.item').forEach(el => {

      el.addEventListener('mouseenter', () => {
        tooltip.innerText = el.dataset.name || el.dataset.type;
        tooltip.style.opacity = '1';
      });

      el.addEventListener('mousemove', (e) => {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
      });

      el.addEventListener('mouseleave', () => {
        tooltip.style.opacity = '0';
      });

    });

    // tool tooltips
    document.querySelectorAll('.tool').forEach(el => {

      el.addEventListener('mouseenter', () => {
        tooltip.innerText = el.dataset.name;
        tooltip.style.opacity = '1';
      });

      el.addEventListener('mousemove', (e) => {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
      });

      el.addEventListener('mouseleave', () => {
        tooltip.style.opacity = '0';
      });

    });

    // ==== timer stuff
    const timerEl = document.getElementById('game-timer');

    function updateTimerUI() {
      const min = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
      const sec = String(remainingSeconds % 60).padStart(2, '0');

      timerEl.innerText = `${min}:${sec}`;
    }

    function startGameTimer() {
      updateTimerUI();

      const interval = setInterval(() => {

        if (gameEnded) {
          clearInterval(interval);
          return;
        }

        remainingSeconds--;

        updateTimerUI();

        if (remainingSeconds <= 0) {
          clearInterval(interval);
          endGame();
        }

      }, 1000);
    }

    // END game function
    function endGame() {

      if (gameEnded) return;

      gameEnded = true;

      currentTurn = 'ended';

      // hide previews/cursors
      previewRect.visible(false);
      pathPreview.visible(false);

      botPlaceCursor.visible(false);
      botDeleteCursor.visible(false);

      highlightLayer.draw();
      cursorLayer.draw();

      // disable all clicks in sidebar
      document.querySelectorAll('.item, .tool').forEach(el => {
        el.style.pointerEvents = 'none';
        el.style.opacity = '0.5';
      });

      // export image BEFORE overlay appears
      // temporarily hide overlays/highlights
      humanHighlight.visible(false);
      botHighlight.visible(false);
      previewRect.visible(false);
      pathPreview.visible(false);

      botPlaceCursor.visible(false);
      botDeleteCursor.visible(false);

      highlightLayer.draw();
      cursorLayer.draw();

      // export clean image
      const dataURL = stage.toDataURL({
        pixelRatio: 2
      });

      // restore visuals (optional since game ended,
      // but keeps internal state clean)
      humanHighlight.visible(true);
      botHighlight.visible(true);

      highlightLayer.draw();
      cursorLayer.draw();

      // show overlay
      document.getElementById('end-overlay').style.display = 'flex';
      launchConfetti();

      // download button
      document.getElementById('download-btn').onclick = () => {

        const link = document.createElement('a');

        link.download = 'mijn-park.png';
        link.href = dataURL;

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);
      };

      // survey button
      document.getElementById('survey-btn').onclick = () => {

        window.open(
          'https://survey.uu.nl/jfe/form/SV_37r9IxCfCtaY7m6',
          '_blank'
        );
      };
    }
    function launchConfetti() {
      // immediate burst
      confetti({
        particleCount: 180,
        spread: 120,
        origin: { y: 0.6 }
      });

      // left cannon
      confetti({
        particleCount: 120,
        angle: 60,
        spread: 90,
        origin: { x: 0 }
      });

      // right cannon
      confetti({
        particleCount: 120,
        angle: 120,
        spread: 90,
        origin: { x: 1 }
      });

      // continuous celebration
      const duration = 4500;
      const end = Date.now() + duration;

      const interval = setInterval(() => {

        if (Date.now() > end) {
          clearInterval(interval);
          return;
        }

        confetti({
          particleCount: 18,
          spread: 70,
          startVelocity: 30,
          origin: {
            x: Math.random(),
            y: Math.random() * 0.4
          }
        });

      }, 180);
    }
    // ==== end timer stuff
    
    buildGrass();
    startGameTimer();

    // Building: grass background
    function buildGrass() {
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const img = new Image();
          img.src = grassTiles[Math.floor(Math.random() * grassTiles.length)];

          const tile = new Konva.Image({
            x: x * CELL_SIZE,
            y: y * CELL_SIZE,
            width: CELL_SIZE,
            height: CELL_SIZE
          });

          img.onload = () => {
            tile.image(img);
            grassLayer.draw();
          };

          grassLayer.add(tile);
        }
      }
      updateTurnUI();
    }

    // functions for taking turns

    // ---------- PATH SYSTEM ----------
    const pathTiles = {}; // key: "x-y" → { sprite, connections: {N,E,S,W} }

    const pathSections = [];

    let pathStart = null;
    let pathPreview = null; 

    const pathImages = {

    function createPathSection(startX, startY, endX, endY, owner='human') {

      // ---------- ONLY STRAIGHT LINES
      if (startX !== endX && startY !== endY) {
        return false;
      }

      // ---------- COMPUTE RECT
      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);

      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);

      // ---------- GRID BOUNDS
      if (
        minX < 0 ||
        minY < 0 ||
        maxX >= GRID_SIZE ||
        maxY >= GRID_SIZE
      ) {
        return false;
      }

      // ---------- LENGTH CHECK
      const length =
        startX === endX
          ? Math.abs(endY - startY) + 1
          : Math.abs(endX - startX) + 1;

      // minimum 2, maximum 6
      if (length < 2 || length > MAX_PATH_LENGTH) {
        return false;
      }

      const horizontal = startY === endY;

      const tiles = [];

      // ---------- VALIDATE TILES
      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {

          // ---------- BLOCK OBJECTS
          const blocked = placedSprites.some(p =>
            x < p.x + p.w &&
            x + 1 > p.x &&
            y < p.y + p.h &&
            y + 1 > p.y
          );

          if (blocked) return false;

          // ---------- PATH OVERLAP RULES
          const overlapsExisting = pathTiles[key(x,y)];

          if (overlapsExisting) {

            // horizontal section
            if (horizontal) {

              const left = pathTiles[key(x-1,y)];
              const right = pathTiles[key(x+1,y)];

              // already horizontal path here
              if (left && right) {
                return false;
              }

            // vertical section
            } else {

              const up = pathTiles[key(x,y-1)];
              const down = pathTiles[key(x,y+1)];

              // already vertical path here
              if (up && down) {
                return false;
              }
            }
          }

          // ---------- PREVENT PARALLEL ADJACENT LANES
          if (!overlapsExisting) {

            if (horizontal) {

              const above = pathTiles[key(x, y - 1)];
              const below = pathTiles[key(x, y + 1)];

              // avoid horizontal lane beside horizontal lane
              if (
                (above && (above.connections.E || above.connections.W)) ||
                (below && (below.connections.E || below.connections.W))
              ) {
                return false;
              }

            } else {

              const left = pathTiles[key(x - 1, y)];
              const right = pathTiles[key(x + 1, y)];

              // avoid vertical lane beside vertical lane
              if (
                (left && (left.connections.N || left.connections.S)) ||
                (right && (right.connections.N || right.connections.S))
              ) {
                return false;
              }
            }
          }

          tiles.push({x,y});
        }
      }

      // ---------- OWNERSHIP RECTANGLE
      const bg = new Konva.Rect({
        x: minX * CELL_SIZE,
        y: minY * CELL_SIZE,
        width: (maxX - minX + 1) * CELL_SIZE,
        height: (maxY - minY + 1) * CELL_SIZE,
        fill: owner === 'human' ? 'orange' : 'blue',
        opacity: 0.2,
        listening: false
      });

      ownershipLayer.add(bg);

      // ---------- CREATE / INCREMENT PATHS
      tiles.forEach(({x,y}) => {

        const k = key(x,y);

        if (!pathTiles[k]) {

          pathTiles[k] = {
            sprite: null,
            connections: {N:false,E:false,S:false,W:false},
            refs: 0
          };
        }

        pathTiles[k].refs++;
      });

      // ---------- REBUILD CONNECTIONS
      recomputeAllPaths();

      // ---------- STORE SECTION
      pathSections.push({
        owner,
        startX,
        startY,
        endX,
        endY,
        tiles,
        bg
      });

      // ---------- TRACK LAST ACTION
      lastHumanAction = {
        type: 'path',
        startX,
        startY,
        endX,
        endY
      };

      itemLayer.draw();
      ownershipLayer.draw();

      return true;
    }

    function deletePathSection(gridX, gridY, isBot=false) {

      const sectionIndex = pathSections.findIndex(section =>
        section.tiles.some(t => t.x === gridX && t.y === gridY)
      );

      if (sectionIndex === -1) return;

      const section = pathSections[sectionIndex];

      section.tiles.forEach(({x,y}) => {

        const k = key(x,y);

        if (!pathTiles[k]) return;

        pathTiles[k].refs--;

        if (pathTiles[k].refs <= 0) {

          if (pathTiles[k].sprite) {
            pathTiles[k].sprite.destroy();
          }

          delete pathTiles[k];
        }
      });

      section.bg.destroy();

      pathSections.splice(sectionIndex, 1);

      recomputeAllPaths();

      lastHumanAction = {
        type: 'deletePath',
        x: gridX,
        y: gridY
      };

      itemLayer.draw();
      ownershipLayer.draw();

      if (!isBot) {
        endHumanTurn();
      } else {
        endBotTurn();
      }
    }
   
    //needed for PATH drawing
    function key(x, y) {
      return `${x}-${y}`;
    }

    // Path drawing helper function: get current connections
    function getConnections(x, y) {
      return pathTiles[key(x, y)]?.connections || { N:false, E:false, S:false, W:false };
    }

    // getconnections still used?
    function getConnectedPathTiles(startX, startY) {
      const visited = new Set();
      const stack = [[startX, startY]];
      const result = [];

      while (stack.length) {
        const [x, y] = stack.pop();
        const k = key(x, y);

        if (visited.has(k)) continue;
        if (!pathTiles[k]) continue;

        visited.add(k);
        result.push([x, y]);

        const neighbors = [
          [x+1,y], [x-1,y],
          [x,y+1], [x,y-1]
        ];

        neighbors.forEach(([nx, ny]) => {
          if (!visited.has(key(nx, ny))) {
            stack.push([nx, ny]);
          }
        });
      }

      return result;
    }

    // Path drawing helper function: set connections
    function setConnection(conn, dir, val) {
      conn[dir] = val;
    }

    // Path drawing helper function: connection definitions
    function connectionsToTile(conn) {
      const {N,E,S,W} = conn;

      const map = {
        "0000": "closedA",
        "1000": "openN",
        "0010": "openS",
        "0100": "openE",
        "0001": "openW",
        "1010": "openNS",
        "0101": "openWE",
        "0110": "openSE",
        "1100": "openNE",
        "0011": "openSW",
        "1001": "openNW",
        "1110": "openNSE",
        "1011": "openNSW",
        "0111": "openSWE",
        "1101": "openNWE",
        "1111": "openA"
      };

      const keyStr = `${+N}${+E}${+S}${+W}`;
      return map[keyStr] || "closedA";
    }

    // Path drawing helper function: recompute all paths
    function recomputeAllPaths() {
      // 1. reset all connections
      Object.keys(pathTiles).forEach(k => {
        pathTiles[k].connections = { N:false, E:false, S:false, W:false };
      });

      // 2. rebuild connections
      Object.keys(pathTiles).forEach(k => {
        const [x, y] = k.split('-').map(Number);
        const conn = pathTiles[k].connections;

        const dirs = [
          { dx:0, dy:-1, d:"N" },
          { dx:1, dy:0, d:"E" },
          { dx:0, dy:1, d:"S" },
          { dx:-1, dy:0, d:"W" }
        ];

        dirs.forEach(({dx,dy,d}) => {
          if (pathTiles[key(x+dx, y+dy)]) {
            conn[d] = true;
          }
        });
      });

      // 3. redraw everything
      Object.keys(pathTiles).forEach(k => {
        const [x, y] = k.split('-').map(Number);
        if (pathTiles[k]) {
          drawPathTile(x, y);
        }
      });
    }

    // Path drawing function
    function drawPathTile(x, y) {
      const conn = getConnections(x, y);
      const tileType = connectionsToTile(conn);

      const img = new Image();
      img.src = pathImages[tileType];

      img.onload = () => {
        let tile = pathTiles[key(x,y)]?.sprite;

        if (!tile) {
          tile = new Konva.Image({
            x: x * CELL_SIZE,
            y: y * CELL_SIZE,
            width: CELL_SIZE,
            height: CELL_SIZE,
          });

          itemLayer.add(tile);

          // IMPORTANT:
          // never overwrite the existing tile object
          pathTiles[key(x,y)].sprite = tile;
        }

        tile.image(img);
        itemLayer.draw();
      };
    }

    // another path check that prevents suqare creation
    function createsSquare(x, y) {
      const exists = (px, py) => !!pathTiles[key(px, py)];

      // check all 2x2 squares this tile could be part of
      const squares = [
        [ [x,y], [x+1,y], [x,y+1], [x+1,y+1] ],
        [ [x,y], [x-1,y], [x,y+1], [x-1,y+1] ],
        [ [x,y], [x+1,y], [x,y-1], [x+1,y-1] ],
        [ [x,y], [x-1,y], [x,y-1], [x-1,y-1] ],
      ];

      for (const square of squares) {
        let count = 0;

        square.forEach(([sx, sy]) => {
          if ((sx === x && sy === y) || exists(sx, sy)) {
            count++;
          }
        });

        // if all 4 tiles would exist → square
        if (count === 4) return true;
      }

      return false;
    }

    function isPathEndpoint(x, y) {
      const conn = getConnections(x, y);

      const count =
        (conn.N ? 1 : 0) +
        (conn.E ? 1 : 0) +
        (conn.S ? 1 : 0) +
        (conn.W ? 1 : 0);

      return count === 1;
    }

    // ------------------ END PATH SYSTEM ----------

    function canPlace(type, x, y) {
      const s = spriteSizes[type];

      // bounds check
      if (x < 0 || y < 0 || x + s.w > GRID_SIZE || y + s.h > GRID_SIZE) {
        return false;
      }

      // prevent placing on path tiles
      for (let px = x; px < x + s.w; px++) {
        for (let py = y; py < y + s.h; py++) {
          if (pathTiles[key(px, py)]) {
            return false;
          }
        }
      }

      // overlap check
      for (const p of placedSprites) {
        const overlap =
          x < p.x + p.w &&
          x + s.w > p.x &&
          y < p.y + p.h &&
          y + s.h > p.y;

        if (!overlap) continue;

        if (type === 'path' && p.type === 'path') continue;

        return false;
      }

      return true;
    }

    // for BOT determine position scores when following
    function scorePosition(type, x, y, humanX, humanY) {
      let score = 0;

      const category = spriteSizes[type].c;

      // ---------- 1. SYMMETRY (strong weight)
      const centerX = Math.floor(GRID_SIZE / 2);
      const centerY = Math.floor(GRID_SIZE / 2);

      const dx = humanX - centerX;
      const dy = humanY - centerY;

      const sx = centerX - dx;
      const sy = centerY - dy;

      const distToSymmetry = Math.abs(x - sx) + Math.abs(y - sy);

      // score += Math.max(0, 20 - distToSymmetry * 5); // strong pull
      score += BOT_SYMMETRY_STRENGTH * Math.max(0, 20 - distToSymmetry * 5);


      // ---------- 2. CLUSTERING (same category neighbors)
      let neighbors = 0;

      for (const p of placedSprites) {
        if (spriteSizes[p.type].c !== category) continue;

        const dist = Math.abs(x - p.x) + Math.abs(y - p.y);
        if (dist <= 2) neighbors++;
      }

      score += neighbors * 4;


      // ---------- 3. DISTANCE TO HUMAN (soft preference)
      const distToHuman = Math.abs(x - humanX) + Math.abs(y - humanY);
      score += Math.max(0, 10 - distToHuman);


      return score;
    }

    // for BOT to find best scoring position when following
    function findBestPosition(type, originX, originY) {
      let best = null;
      let bestScore = -Infinity;

      // search area (local but wide enough)
      for (let dx = -4; dx <= 4; dx++) {
        for (let dy = -4; dy <= 4; dy++) {
          const x = originX + dx;
          const y = originY + dy;

          if (!canPlace(type, x, y)) continue;

          const score = scorePosition(type, x, y, originX, originY);

          if (score > bestScore) {
            bestScore = score;
            best = { x, y };
          }
        }
      }

      return best;
    }

    // for BOT to find good enough position when being imperfect
    function findGoodEnoughPosition(type, originX, originY) {
      const candidates = [];

      for (let dx = -BOT_LOCAL_RADIUS; dx <= BOT_LOCAL_RADIUS; dx++) {
        for (let dy = -BOT_LOCAL_RADIUS; dy <= BOT_LOCAL_RADIUS; dy++) {

          const x = originX + dx;
          const y = originY + dy;

          if (!canPlace(type, x, y)) continue;

          const score = scorePosition(
            type,
            x,
            y,
            originX,
            originY
          );

          candidates.push({ x, y, score });
        }
      }

      if (!candidates.length) return null;

      // sort best → worst
      candidates.sort((a, b) => b.score - a.score);

      const bestScore = candidates[0].score;

      // keep positions close to best
      const acceptable = candidates.filter(c =>
        c.score >= bestScore * (1 - BOT_GOOD_ENOUGH_VARIATION)
      );

      return acceptable[
        Math.floor(Math.random() * acceptable.length)
      ];
    }

    // ---------- MULTI-TILE PLACEMENT ----------
    function placeSprite(type, gridX, gridY, isBot = false) {
      const cat = spriteSizes[type].c;

      // category 4 restriction (except fun7 + fun11)
      if (cat === 4 && type !== 'fun7' && type !== 'fun11') {
        if (placedUniqueFun.has(type)) return;
      }

      // check whether grid cell is already occupied
      if (!canPlace(type, gridX, gridY)) return;

      const img = new Image();
      img.src = spriteImages[type];

      img.onload = () => {
        const wat = spriteSizes[type];
        const widthPx = wat.w * CELL_SIZE;
        const heightPx = wat.h * CELL_SIZE;

        const sprite = new Konva.Image({
          id: `cell-${gridX}-${gridY}`,
          x: gridX * CELL_SIZE,
          y: gridY * CELL_SIZE,
          width: widthPx,
          height: heightPx,
          image: img,
          draggable: false,
        });

        sprite.scale({ x: 0.1, y: 0.1 });
        itemLayer.add(sprite);

        sprite.to({
          scaleX: 1,
          scaleY: 1,
          duration: 0.15,
          easing: Konva.Easings.EaseOut
        });

        itemLayer.draw();

        // track placement
        placedSprites.push({
          type,
          x: gridX,
          y: gridY,
          w: wat.w,
          h: wat.h,
          sprite
        });        

        // disable button for fun item after placing, except fountainand statue
        if (cat === 4 && type !== 'fun7' && type !== 'fun11') {
          placedUniqueFun.add(type);

          const btn = document.querySelector(`[data-type="${type}"]`);
          if (btn) {
            btn.style.opacity = "0.3";
            btn.style.pointerEvents = "none";
          }
        }

        // only track HUMAN actions
        if (!isBot) {
          lastHumanAction = { type, x: gridX, y: gridY };
          //triggerBot();
          endHumanTurn();
          showHighlight('human', gridX, gridY, wat.w, wat.h);
        } else {
          showHighlight('bot', gridX, gridY, wat.w, wat.h);
        }
      };
    }

    // delete function, anywher on item works
    function deleteSprite(gridX, gridY, isBot = false) {
      // find ANY object covering this tile (not just top-left)
      const index = placedSprites.findIndex(p =>
        gridX >= p.x &&
        gridX < p.x + p.w &&
        gridY >= p.y &&
        gridY < p.y + p.h
      );

      if (index === -1) return;

      const obj = placedSprites[index];
      const type = obj.type;
      const cat = spriteSizes[type].c;

      obj.sprite.to({
        scaleX: 0.1,
        scaleY: 0.1,
        duration: 0.15,
        onFinish: () => {
          obj.sprite.destroy();
          itemLayer.draw();
        }
      });

      placedSprites.splice(index, 1);

      // re-enable category 4 button
      if (cat === 4 && type !== 'fun7' && type !== 'fun11') {
        placedUniqueFun.delete(type);

        const btn = document.querySelector(`[data-type="${type}"]`);
        if (btn) {
          btn.style.opacity = "1";
          btn.style.pointerEvents = "auto";
        }
      }

      if (!isBot) {
        lastHumanAction = { delete: true, x: gridX, y: gridY };
        //triggerBot();
        endHumanTurn();
        showHighlight('human', obj.x, obj.y, obj.w, obj.h);
      } else {
        showHighlight('bot', obj.x, obj.y, obj.w, obj.h);
      }
    }

    function runBotTurn() {

      botFollow();
    }

    // newer botFollow that acts more intentional (clustering, symmetry, follow and fallback)
    function botFollow() {
      const { type, x, y } = lastHumanAction;

      if (lastHumanAction.type === 'deletePath' | lastHumanAction.delete) {
        botImperfect();
        return;
      }

      if (type === 'path') {
        console.log(type);
        return botFollowPathSection();
      }

      const category = spriteSizes[type].c;

      // ---------- COLLABORATIVE COMPLETION OBJECTS ----------
      if (category === 9) {
        const target = placedSprites.find(p =>
          p.x === x &&
          p.y === y &&
          p.type === type
        );
        if (!target) {
          botBusy = false;
          endBotTurn();
          return;
        }

        const completedType = spriteSizes[type].completesTo;

        return moveBotCursorTo(x, y, 'place', type, () => {
          completeSprite(target, completedType);
          const doneSize = spriteSizes[completedType];
          showHighlight('bot', x, y, doneSize.w, doneSize.h);
        });
      }

      // do NOT follow fun (4) or benches (5)
      if (category === 4 || category === 5) {
        botImperfect();
        // fallback safety (only if botImperfect didn't schedule anything)
        if (botBusy) {
          setTimeout(() => {
            if (botBusy) botBusy = false;
          }, 500);
        }
        return;
      }
      
      // const options = Object.keys(spriteSizes).filter(t => spriteSizes[t].c === category);
      const options = Object.keys(spriteSizes).filter(t =>  spriteSizes[t].c === category &&  !t.endsWith('_done'));
      const botType = options[Math.floor(Math.random() * options.length)];

      const best = findBestPosition(botType, x, y);

      if (best) {
        return moveBotCursorTo(best.x, best.y, 'place', botType, () => {
          placeSprite(botType, best.x, best.y, true);
        });
      }

      // fallback (rare)
      botImperfect();
    }

    // imperfect following instead of random
    function botImperfect() {
      const { type, x, y } = lastHumanAction;

      // path reactions
      if (type === 'path') {

        // sometimes decorate path instead of extending it
        if (Math.random() < 0.6) {

          const nearbyPaths = Object.keys(pathTiles)
            .map(k => {
              const [px, py] = k.split('-').map(Number);
              return { x: px, y: py };
            })
            .filter(p =>
              Math.abs(p.x - x) <= BOT_LOCAL_RADIUS &&
              Math.abs(p.y - y) <= BOT_LOCAL_RADIUS
            );

          if (nearbyPaths.length) {

            const chosen =
              nearbyPaths[
                Math.floor(Math.random() * nearbyPaths.length)
              ];

            const benchTypes = ['rot1', 'rot2', 'rot3', 'rot4'];

            for (let i = 0; i < 8; i++) {

              const bench =
                benchTypes[
                  Math.floor(Math.random() * benchTypes.length)
                ];

              const bx =
                chosen.x + Math.floor(Math.random() * 3) - 1;

              const by =
                chosen.y + Math.floor(Math.random() * 3) - 1;

              if (canPlace(bench, bx, by)) {

                return moveBotCursorTo(
                  bx,
                  by,
                  'place',
                  bench,
                  () => {
                    placeSprite(bench, bx, by, true);
                  }
                );
              }
            }
          }
        }

        // fallback to normal path behavior
        return botFollowPathSection();
      }

      const category = spriteSizes[type]?.c;

      // collaborative objects should still complete
      if (category === 9) {
        return botFollow();
      }

      // nearby complementary categories
      let candidateTypes = [];

      // nature categories blend together
      if (category === 1 || category === 2 || category === 3) {

        candidateTypes = Object.keys(spriteSizes).filter(t => {

          const c = spriteSizes[t].c;

          return (
            (c === 1 || c === 2 || c === 3) &&
            !t.endsWith('_done')
          );
        });

      } else {

        // fallback:
        // use same category but imperfect position
        candidateTypes = Object.keys(spriteSizes).filter(t =>
          spriteSizes[t].c === category &&
          !t.endsWith('_done')
        );
      }

      if (!candidateTypes.length) {
        botBusy = false;
        endBotTurn();
        return;
      }

      const chosenType =
        candidateTypes[
          Math.floor(Math.random() * candidateTypes.length)
        ];

      const pos = findGoodEnoughPosition(
        chosenType,
        x,
        y
      );

      if (!pos) {

        // soft fallback:
        // attempt logical follow instead of random
        return botFollow();
      }

      return moveBotCursorTo(
        pos.x,
        pos.y,
        'place',
        chosenType,
        () => {
          placeSprite(
            chosenType,
            pos.x,
            pos.y,
            true
          );
        }
      );
    }

    function botFollowPathSection() {
      if (!pathSections.length) {
        botBusy = false;
        return;
      }

      const last = pathSections[pathSections.length - 1];

      // direction vector of last section
      let dx = 0;
      let dy = 0;

      if (last.startX === last.endX) {
        dy = last.endY > last.startY ? 1 : -1;
      } else {
        dx = last.endX > last.startX ? 1 : -1;
      }

      // choose new length (2–6 tiles)
      const len = Math.floor(Math.random() * (MAX_PATH_LENGTH - 1)) + 2;

      const endpoints = [];

      Object.keys(pathTiles).forEach(k => {
        const [x, y] = k.split('-').map(Number);

        if (isPathEndpoint(x, y)) {
          endpoints.push({x, y});
        }
      });

      // if there are no endpoints to connect to...
      if (!endpoints.length) {
        botImperfect();
        return;
      }

      const chosen = endpoints[Math.floor(Math.random() * endpoints.length)];

      const startX = chosen.x;
      const startY = chosen.y;

      const endX = startX + dx * len;
      const endY = startY + dy * len;

      // clamp to grid
      const cx = Math.max(0, Math.min(GRID_SIZE - 1, endX));
      const cy = Math.max(0, Math.min(GRID_SIZE - 1, endY));

      if (startX === cx && startY === cy) {
        botBusy = false;
        endBotTurn();
        return;
      }

      moveBotCursorTo(startX, startY, 'place', 'path', () => {
        const success = createPathSection(
          startX,
          startY,
          cx,
          cy,
          'bot'
        );
        if (!success) {
          botBusy = false;
          endBotTurn();
        }
      });
    }

    function moveBotCursorTo(gridX, gridY, mode, type, callback) {
      if (mode === 'place' && !botPlaceReady) {
        // fallback: skip animation but still place
        if (callback) callback();
        botBusy = false;
        return;
      }
      const baseX = gridX * CELL_SIZE;
      const baseY = gridY * CELL_SIZE;

      // hide both first
      botPlaceCursor.visible(false);
      botDeleteCursor.visible(false);

      let cursor;

      if (mode === 'place') {
        botSelectTool('pick');

        if (type) {
          botSelectItem(type);
        }
      }

      if (mode === 'delete') {
        botSelectTool('erase');
      }

      if (mode === 'place') {
        cursor = botPlaceCursor;
      } else {
        cursor = botDeleteCursor;
      }

      // always 1 tile size
      cursor.width(CELL_SIZE);
      cursor.height(CELL_SIZE);

      // ---------- CURRENT POSITION (already initialized to center)
      const startX = cursor.x();
      const startY = cursor.y();

      // ---------- MISALIGNMENT (small offset)
      const offsetX = (Math.random() - 0.5) * 6; // -3 to +3 px
      const offsetY = (Math.random() - 0.5) * 6;

      const targetX = baseX + offsetX;
      const targetY = baseY + offsetY;

      cursor.scale({ x: 1, y: 1 });
      cursor.visible(true);

      // ---------- PRE-MOVE HESITATION ----------
      const preDelay = [80, 120, 160][Math.floor(Math.random() * 3)];

      setTimeout(() => {
        cursor.visible(true);
        // ---------- MOVE (slightly imperfect)
        cursor.to({
          x: targetX,
          y: targetY,
          duration: 0.35,
          easing: Konva.Easings.EaseInOut,
          onFinish: () => {

            // ---------- MICRO CORRECTION (snap into place)
            cursor.to({
              x: baseX,
              y: baseY,
              duration: 0.08,
              onFinish: () => {

                // ---------- HOVER DELAY ----------
                const hoverDelay = [120, 180, 250][Math.floor(Math.random() * 3)];

                setTimeout(() => {

                  // ---------- CLICK ----------
                  cursor.to({
                    scaleX: 0.8,
                    scaleY: 0.8,
                    duration: 0.08,
                    onFinish: () => {
                      cursor.to({
                        scaleX: 1,
                        scaleY: 1,
                        duration: 0.08,
                        onFinish: () => {

                          cursor.visible(false);

                          if (callback) callback();

                          botBusy = false;
                          endBotTurn();
                        }
                      });
                    }
                  });

                }, hoverDelay);
              }
            });

          }
        });

      }, preDelay);
    }

    // ---------- FIXED KONVA CLICK DETECTION ----------
    // Must set listening(true) and pointer-events must not be blocked
    grassLayer.listening(true);
    itemLayer.listening(true);
    stage.listening(true);

    // validity rectangle for item placement
    stage.on('pointermove', () => {
      const pos = stage.getPointerPosition();
      if (!pos) return;

      const gridX = Math.floor(pos.x / CELL_SIZE);
      const gridY = Math.floor(pos.y / CELL_SIZE);

      // Only show for placement (not erase, not bot)
      if (!selectedType || selectedTool === 'erase' || (spriteSizes[selectedType]?.c === 4 && selectedType !== 'fun7' && selectedType !== 'fun11' && placedUniqueFun.has(selectedType))) {
        previewRect.visible(false);
        highlightLayer.draw();
        return;
      }

      // path drawing preview logic
      if (selectedType === 'path' && pathStart) {

        const dx = Math.abs(gridX - pathStart.x);
        const dy = Math.abs(gridY - pathStart.y);

        let previewX = pathStart.x;
        let previewY = pathStart.y;

        let previewW = 1;
        let previewH = 1;

        // horizontal wins
        if (dx >= dy) {
          previewX = Math.min(pathStart.x, gridX);
          // previewW = Math.abs(gridX - pathStart.x) + 1;
          previewW = Math.min(MAX_PATH_LENGTH,Math.abs(gridX - pathStart.x) + 1);
        } else {
          previewY = Math.min(pathStart.y, gridY);
          // previewH = Math.abs(gridY - pathStart.y) + 1;
          previewH = Math.min(MAX_PATH_LENGTH,Math.abs(gridY - pathStart.y) + 1);
        }

        pathPreview.x(previewX * CELL_SIZE);
        pathPreview.y(previewY * CELL_SIZE);

        pathPreview.width(previewW * CELL_SIZE);
        pathPreview.height(previewH * CELL_SIZE);

        pathPreview.visible(true);

        highlightLayer.batchDraw();
      }

      const size = spriteSizes[selectedType] || { w: 1, h: 1 };

      previewRect.x(gridX * CELL_SIZE);
      previewRect.y(gridY * CELL_SIZE);
      previewRect.width(size.w * CELL_SIZE);
      previewRect.height(size.h * CELL_SIZE);

      // validity check
      // const valid = selectedType === 'path' ? !createsSquare(gridX, gridY) : canPlace(selectedType, gridX, gridY);
      const valid = canPlace(selectedType, gridX, gridY);

      previewRect.fill(valid ? 'green' : 'red');
      previewRect.visible(true);

      highlightLayer.batchDraw();
    });

    stage.on('pointerdown', () => {
      if (gameEnded) return;
      if (currentTurn !== 'human') return;
      previewRect.visible(false);
      const pos = stage.getPointerPosition();
      if (!pos) return; // safety

      const gridX = Math.floor(pos.x / CELL_SIZE);
      const gridY = Math.floor(pos.y / CELL_SIZE);

      if (selectedTool === 'erase') {
        // try deleting path first
        if (pathTiles[key(gridX, gridY)]) {
          deletePathSection(gridX, gridY);
        } else {
          deleteSprite(gridX, gridY);
        }
        return;
      }

      // Tool: pick
      if (selectedTool === 'pick') {
        const existing = itemLayer.findOne(`#cell-${gridX}-${gridY}`);
        if (existing) {
          const src = existing.image().src;
          const type = Object.keys(spriteImages).find(t => spriteImages[t] === src);

          if (type) {
            clearSelectedUIitem();
            document.querySelector(`[data-type="${type}"]`).classList.add('selected');
            selectedType = type;
          }
        }
        return;
      }

      // Placement mode
      if (selectedType === 'path') {
        // first click
        if (!pathStart) {
          pathStart = {x:gridX, y:gridY};
          return;
        }
        let targetX = gridX;
        let targetY = gridY;

        // clamp to max length
        if (pathStart.x === gridX) {

          const dir = Math.sign(gridY - pathStart.y);

          targetY =
            pathStart.y +
            dir * (MAX_PATH_LENGTH - 1);

          if (Math.abs(gridY - pathStart.y) < MAX_PATH_LENGTH) {
            targetY = gridY;
          }

        } else {

          const dir = Math.sign(gridX - pathStart.x);

          targetX =
            pathStart.x +
            dir * (MAX_PATH_LENGTH - 1);

          if (Math.abs(gridX - pathStart.x) < MAX_PATH_LENGTH) {
            targetX = gridX;
          }
        }
                // second click
        const success = createPathSection(
          pathStart.x,
          pathStart.y,
          targetX,
          targetY,
          'human'
        );
        if (success) {
          endHumanTurn();
        }
        pathStart = null;
        pathPreview.visible(false);
        highlightLayer.draw();
        return;
      }

      if (selectedType) {
        console.log("placing elements");
        deleteSprite(gridX, gridY);
        placeSprite(selectedType, gridX, gridY);
      }
    });

    function updateCursor() {
      const container = document.getElementById('stage-container');

      if (!selectedType || selectedTool === 'erase') {
        previewRect.visible(false);
        highlightLayer.draw();
      }

      if (selectedTool === 'erase') {
        container.style.cursor = "url('assets/cursor-erase-human.png') 16 16, auto";
      } else {
        container.style.cursor = "url('assets/cursor-place-human.png') 16 16, auto";
      }
    }
