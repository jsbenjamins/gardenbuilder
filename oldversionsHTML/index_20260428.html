<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garden Builder</title>
  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
  <style>
    body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
    #sidebar {
      width: 220px;
      background: #f3f3f3;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }
    .item, .tool {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      font-size: 32px;
    }
    .selected {
      border-color: #4caf50;
      box-shadow: 0 0 5px #4caf50;
    }
    .botplayer {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgb(120, 145, 85);
      font-size: 32px;
      border-color: #ff0000;
      box-shadow: 0 0 5px #c70b0b;
    }
    #tools { display: flex; gap: 5px; }
    #stage-container {
      flex: 1;
      cursor: url('assets/cursor-place-human.png') 16 16, auto;
    }
  </style>
</head>

  <div id="stage-container"></div>

  <script>
    const GRID_SIZE = 25;
    const CELL_SIZE = 32;
    const width = GRID_SIZE * CELL_SIZE;
    const height = GRID_SIZE * CELL_SIZE;
    
    const grassTiles = [
      'assets/grass1.png',
      'assets/grass2.png',
      'assets/grass3.png',
      'assets/grass4.png'
    ];

    const stage = new Konva.Stage({
      container: 'stage-container',
      width,
      height
    });

    const bgLayer = new Konva.Layer();
    const itemLayer = new Konva.Layer();
    stage.add(bgLayer);
    stage.add(itemLayer);

    // BOT stuff
    const BOT_FOLLOW_CHANCE = 0.8;

    let lastHumanAction = null; // { type, x, y }
    let placedSprites = [];     // track placements 
    let currentPathDirection = null; 
    let lastPathTile = null;

    // set HUMAN into start mode
    let selectedType = null;
    let selectedTool = null;
    let zCounter = 1;
    let lastTurnWasRecent = false; // path drawing behavior

    const BOT_SYMMETRY_STRENGTH = 1.0; // 0 → off, 2 → very strong

    const botPlaceCursor = new Konva.Image({
      x: 0,
      y: 0,
      opacity: 0.5,
      visible: false
    });

    const botDeleteCursor = new Konva.Image({
      x: 0,
      y: 0,
      width: CELL_SIZE,
      height: CELL_SIZE,
      opacity: 0.5,
      visible: false
    });

    const centerX = Math.floor(GRID_SIZE / 2) * CELL_SIZE;
    const centerY = Math.floor(GRID_SIZE / 2) * CELL_SIZE;

    botPlaceCursor.x(centerX);
    botPlaceCursor.y(centerY);

    botDeleteCursor.x(centerX);
    botDeleteCursor.y(centerY);

    let botPlaceReady = false;

    const botPlaceImg = new Image();
    botPlaceImg.src = 'assets/bot-place.png';
    botPlaceImg.onload = () => {
      botPlaceCursor.image(botPlaceImg);
      botPlaceReady = true;
    };

    const botDeleteImg = new Image();
    botDeleteImg.src = 'assets/bot-erase.png';
    botDeleteImg.onload = () => {
      botDeleteCursor.image(botDeleteImg);
    };

    itemLayer.add(botPlaceCursor);
    itemLayer.add(botDeleteCursor);

    // set bot to not busy at start
    let botBusy = false;

    const spriteImages = {
      tree1: 'assets/tree1.png',
      tree2: 'assets/tree2.png',
      tree3: 'assets/tree3.png',

      bush1: 'assets/bush1.png',
      bush2: 'assets/bush2.png',
      bush3: 'assets/bush3.png',
      
      flbed1: 'assets/bluefl.png',
      flbed2: 'assets/redfl.png',
      flbed3: 'assets/yellowfl.png',

      fun1: 'assets/funel/bcourt.png',
      fun2: 'assets/funel/cartE.png',
      fun3: 'assets/funel/cartW.png',
      fun4: 'assets/funel/ccourt.png',
      fun5: 'assets/funel/chess.png',
      fun6: 'assets/funel/dpond.png',
      fun7: 'assets/funel/fountain.png',
      fun8: 'assets/funel/hpipe.png',
      fun9: 'assets/funel/pzoo.png',
      fun10: 'assets/funel/soccer.png',
      fun11: 'assets/funel/statue.png',
      fun12: 'assets/funel/swing.png',
      fun13: 'assets/funel/wip.png',
      fun14: 'assets/funel/slideE.png',
      fun15: 'assets/funel/slideW.png',

      rot1: 'assets/funel/benchN.png',
      rot2: 'assets/funel/benchE.png',
      rot3: 'assets/funel/benchS.png',
      rot4: 'assets/funel/benchW.png',
    };

    // Multi-tile size and category definitions (1 = trees, 2 = bushes, to be extended later)
    const spriteSizes = {
      tree1: { w: 2, h: 2, c: 1},
      tree2: { w: 2, h: 2, c: 1},
      tree3: { w: 2, h: 3, c: 1},

      bush1: { w: 1, h: 1, c: 2},
      bush2: { w: 1, h: 1, c: 2},
      bush3: { w: 1, h: 1, c: 2 },

      flbed1: { w: 2, h: 2, c: 3},
      flbed2: { w: 2, h: 2, c: 3},
      flbed3: { w: 2, h: 2, c: 3 },
         
      fun1: { w: 4, h: 6, c: 4 },
      fun2: { w: 3, h: 3, c: 4 },
      fun3: { w: 3, h: 3, c: 4 },
      fun4: { w: 8, h: 6, c: 4 },
      fun5: { w: 3, h: 3, c: 4 },
      fun6: { w: 4, h: 3, c: 4 },
      fun7: { w: 2, h: 2, c: 4 },
      fun8: { w: 5, h: 4, c: 4 },
      fun9: { w: 6, h: 4, c: 4 },
      fun10: { w: 15, h: 8, c: 4 },
      fun11: { w: 1, h: 2, c: 4 },
      fun12: { w: 3, h: 3, c: 4 },
      fun13: { w: 3, h: 2, c: 4 },
      fun14: { w: 3, h: 3, c: 4 },
      fun15: { w: 3, h: 3, c: 4 },

      rot1: { w: 2, h: 1, c: 5 },
      rot2: { w: 1, h: 2, c: 5 },
      rot3: { w: 2, h: 1, c: 5 },
      rot4: { w: 1, h: 2, c: 5 },
      

      path: { w: 1, h: 1, c: 6 },
    };

    // ---------- PATH SYSTEM ----------
    const pathTiles = {}; // key: "x-y" → { sprite, connections: {N,E,S,W} }

    const pathImages = {
      closedA: 'assets/path/closedA.png',
      openN: 'assets/path/openN.png',
      openS: 'assets/path/openS.png',
      openE: 'assets/path/openE.png',
      openW: 'assets/path/openW.png',
      openNS: 'assets/path/openNS.png',
      openWE: 'assets/path/openWE.png',
      openSE: 'assets/path/openSE.png',
      openNE: 'assets/path/openNE.png',
      openSW: 'assets/path/openSW.png',
      openNW: 'assets/path/openNW.png',
      openNSE: 'assets/path/openNSE.png',
      openNSW: 'assets/path/openNSW.png',
      openSWE: 'assets/path/openSWE.png',
      openNWE: 'assets/path/openNWE.png',
      openA: 'assets/path/openA.png'
    };

    //needed for PATH drawing
    function key(x, y) {
      return `${x}-${y}`;
    }

    // Path drawing helper function: get current connections
    function getConnections(x, y) {
      return pathTiles[key(x, y)]?.connections || { N:false, E:false, S:false, W:false };
    }

    // getconnections still used?
    function getConnectedPathTiles(startX, startY) {
      const visited = new Set();
      const stack = [[startX, startY]];
      const result = [];

      while (stack.length) {
        const [x, y] = stack.pop();
        const k = key(x, y);

        if (visited.has(k)) continue;
        if (!pathTiles[k]) continue;

        visited.add(k);
        result.push([x, y]);

        const neighbors = [
          [x+1,y], [x-1,y],
          [x,y+1], [x,y-1]
        ];

        neighbors.forEach(([nx, ny]) => {
          if (!visited.has(key(nx, ny))) {
            stack.push([nx, ny]);
          }
        });
      }

      return result;
    }

    // Path drawing helper function: set connections
    function setConnection(conn, dir, val) {
      conn[dir] = val;
    }

    // Path drawing helper function: connection definitions
    function connectionsToTile(conn) {
      const {N,E,S,W} = conn;

      const map = {
        "0000": "closedA",
        "1000": "openN",
        "0010": "openS",
        "0100": "openE",
        "0001": "openW",
        "1010": "openNS",
        "0101": "openWE",
        "0110": "openSE",
        "1100": "openNE",
        "0011": "openSW",
        "1001": "openNW",
        "1110": "openNSE",
        "1011": "openNSW",
        "0111": "openSWE",
        "1101": "openNWE",
        "1111": "openA"
      };

      const keyStr = `${+N}${+E}${+S}${+W}`;
      return map[keyStr] || "closedA";
    }

    // Path drawing helper function: recompute all paths
    function recomputeAllPaths() {
      // 1. reset all connections
      Object.keys(pathTiles).forEach(k => {
        pathTiles[k].connections = { N:false, E:false, S:false, W:false };
      });

      // 2. rebuild connections
      Object.keys(pathTiles).forEach(k => {
        const [x, y] = k.split('-').map(Number);
        const conn = pathTiles[k].connections;

        const dirs = [
          { dx:0, dy:-1, d:"N" },
          { dx:1, dy:0, d:"E" },
          { dx:0, dy:1, d:"S" },
          { dx:-1, dy:0, d:"W" }
        ];

        dirs.forEach(({dx,dy,d}) => {
          if (pathTiles[key(x+dx, y+dy)]) {
            conn[d] = true;
          }
        });
      });

      // 3. redraw everything
      Object.keys(pathTiles).forEach(k => {
        const [x, y] = k.split('-').map(Number);
        drawPathTile(x, y);
      });
    }

    // Path drawing function
    function drawPathTile(x, y) {
      const conn = getConnections(x, y);
      const tileType = connectionsToTile(conn);

      const img = new Image();
      img.src = pathImages[tileType];

      img.onload = () => {
        let tile = pathTiles[key(x,y)]?.sprite;

        if (!tile) {
          tile = new Konva.Image({
            x: x * CELL_SIZE,
            y: y * CELL_SIZE,
            width: CELL_SIZE,
            height: CELL_SIZE,
            zIndex: zCounter++
          });

          itemLayer.add(tile);
          pathTiles[key(x,y)] = { sprite: tile, connections: conn };
        }

        tile.image(img);
        itemLayer.draw();
      };
    }

    // another path check that prevents suqare creation
    function createsSquare(x, y) {
      const exists = (px, py) => !!pathTiles[key(px, py)];

      // check all 2x2 squares this tile could be part of
      const squares = [
        [ [x,y], [x+1,y], [x,y+1], [x+1,y+1] ],
        [ [x,y], [x-1,y], [x,y+1], [x-1,y+1] ],
        [ [x,y], [x+1,y], [x,y-1], [x+1,y-1] ],
        [ [x,y], [x-1,y], [x,y-1], [x-1,y-1] ],
      ];

      for (const square of squares) {
        let count = 0;

        square.forEach(([sx, sy]) => {
          if ((sx === x && sy === y) || exists(sx, sy)) {
            count++;
          }
        });

        // if all 4 tiles would exist → square
        if (count === 4) return true;
      }

      return false;
    }

    // Path placing function, precedes draw function
    function placePath(type, x, y, isBot = false) {
      // 1. block overlap
      const blocked = placedSprites.some(p =>
        x < p.x + p.w &&
        x + 1 > p.x &&
        y < p.y + p.h &&
        y + 1 > p.y
      );
      if (blocked) return;

      // 2. prevent squares
      if (createsSquare(x, y)) return;

      const k = key(x, y);

      // 3. create tile if needed
      if (!pathTiles[k]) {
        pathTiles[k] = {
          sprite: null,
          connections: { N:false, E:false, S:false, W:false }
        };
      }

      // 4. FULL GLOBAL RECOMPUTE
      recomputeAllPaths();

      // 5. bot trigger
      if (!isBot) {
        lastHumanAction = { type, x, y };
        triggerBot();
      }
    }

    // function to delete paths tiles
    function deletePath(x, y, isBot = false) {
      const k = key(x, y);
      const tile = pathTiles[k];

      if (!tile) return;

      // remove sprite visually
      if (tile.sprite) {
        tile.sprite.destroy();
      }

      // remove from data
      delete pathTiles[k];

      // recompute all remaining paths
      recomputeAllPaths();

      itemLayer.draw();

      // optional: bot tracking
      if (!isBot) {
        lastHumanAction = { delete: true, x, y };
        triggerBot();
      }
    }

    // function to check general tile availability
    function canPlace(type, x, y) {
      console.log(type);
      const s = spriteSizes[type];

      // bounds check (multi-tile)
      if (x < 0 || y < 0 || x + s.w > GRID_SIZE || y + s.h > GRID_SIZE) {
        return false;
      }

      // overlap check
      for (const p of placedSprites) {
        const overlap =
          x < p.x + p.w &&
          x + s.w > p.x &&
          y < p.y + p.h &&
          y + s.h > p.y;

        if (!overlap) continue;

        // allow path to overwrite path
        if (type === 'path' && p.type === 'path') continue;
        return false;
      }

      return true;
    }

    // for BOT determine position scores when following
    function scorePosition(type, x, y, humanX, humanY) {
      let score = 0;

      const category = spriteSizes[type].c;

      // ---------- 1. SYMMETRY (strong weight)
      const centerX = Math.floor(GRID_SIZE / 2);
      const centerY = Math.floor(GRID_SIZE / 2);

      const dx = humanX - centerX;
      const dy = humanY - centerY;

      const sx = centerX - dx;
      const sy = centerY - dy;

      const distToSymmetry = Math.abs(x - sx) + Math.abs(y - sy);

      // score += Math.max(0, 20 - distToSymmetry * 5); // strong pull
      score += BOT_SYMMETRY_STRENGTH * Math.max(0, 20 - distToSymmetry * 5);


      // ---------- 2. CLUSTERING (same category neighbors)
      let neighbors = 0;

      for (const p of placedSprites) {
        if (spriteSizes[p.type].c !== category) continue;

        const dist = Math.abs(x - p.x) + Math.abs(y - p.y);
        if (dist <= 2) neighbors++;
      }

      score += neighbors * 4;


      // ---------- 3. DISTANCE TO HUMAN (soft preference)
      const distToHuman = Math.abs(x - humanX) + Math.abs(y - humanY);
      score += Math.max(0, 10 - distToHuman);


      return score;
    }

    // for BOT to find best scoring position when following
    function findBestPosition(type, originX, originY) {
      let best = null;
      let bestScore = -Infinity;

      // search area (local but wide enough)
      for (let dx = -4; dx <= 4; dx++) {
        for (let dy = -4; dy <= 4; dy++) {
          const x = originX + dx;
          const y = originY + dy;

          if (!canPlace(type, x, y)) continue;

          const score = scorePosition(type, x, y, originX, originY);

          if (score > bestScore) {
            bestScore = score;
            best = { x, y };
          }
        }
      }

      return best;
    }

    // Building: grass background
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const img = new Image();
        img.src = grassTiles[Math.floor(Math.random() * grassTiles.length)];

        const tile = new Konva.Image({
          x: x * CELL_SIZE,
          y: y * CELL_SIZE,
          width: CELL_SIZE,
          height: CELL_SIZE
        });

        img.onload = () => {
          tile.image(img);
          bgLayer.draw();
        };

        bgLayer.add(tile);
      }
    }

    // No cross-clearing!
    function clearSelectedUItool() {
      document.querySelectorAll('.tool').forEach(el => el.classList.remove('selected'));
    }

    function clearSelectedUIitem() {
      document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
    }

    // Tool selection
    document.querySelectorAll('.tool').forEach(el => {
      el.addEventListener('click', () => {
        clearSelectedUItool();
        el.classList.add('selected');
        selectedTool = el.dataset.tool;
        selectedType = null; // logical only
        updateCursor();
      });
    });

    // Item selection
    document.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => {
        clearSelectedUIitem();
        el.classList.add('selected');
        selectedType = el.dataset.type;
        selectedTool = null; // logical only
        updateCursor();
      });
    });

    // ---------- MULTI-TILE PLACEMENT ----------
    function placeSprite(type, gridX, gridY, isBot = false) {
      // check whether gird cell is already occupied
      if (!canPlace(type, gridX, gridY)) return;

      const img = new Image();
      img.src = spriteImages[type];

      img.onload = () => {
        const wat = spriteSizes[type];
        const widthPx = wat.w * CELL_SIZE;
        const heightPx = wat.h * CELL_SIZE;

        const sprite = new Konva.Image({
          id: `cell-${gridX}-${gridY}`,
          x: gridX * CELL_SIZE,
          y: gridY * CELL_SIZE,
          width: widthPx,
          height: heightPx,
          image: img,
          draggable: false,
        });

        sprite.scale({ x: 0.1, y: 0.1 });
        itemLayer.add(sprite);
        sprite.zIndex(zCounter++);

        sprite.to({
          scaleX: 1,
          scaleY: 1,
          duration: 0.15,
          easing: Konva.Easings.EaseOut
        });

        itemLayer.draw();

        // track placement
        placedSprites.push({
          type,
          x: gridX,
          y: gridY,
          w: wat.w,
          h: wat.h,
          sprite
        });

        // only track HUMAN actions
        if (!isBot) {
          lastHumanAction = { type, x: gridX, y: gridY };
          triggerBot();
        }
      };
    }

    function deleteSprite(gridX, gridY, isBot = false) {
      const index = placedSprites.findIndex(p => p.x === gridX && p.y === gridY);
      if (index === -1) return;

      const obj = placedSprites[index];

      obj.sprite.to({
        scaleX: 0.1,
        scaleY: 0.1,
        duration: 0.15,
        onFinish: () => {
          obj.sprite.destroy();
          zCounter = Math.max(1, zCounter - 1);
          itemLayer.draw();
        }
      });

      placedSprites.splice(index, 1);

      if (!isBot) {
        lastHumanAction = { delete: true, x: gridX, y: gridY };
        triggerBot();
      }
    }

    function triggerBot() {
      const delayOptions = [300, 450, 800, 1300];
      const delay = delayOptions[Math.floor(Math.random() * delayOptions.length)];

      setTimeout(() => runBot(), delay);
    }

    function runBot() {
      if (botBusy) return;
      console.log(lastHumanAction);
      if (!lastHumanAction || lastHumanAction.delete) return;

      botBusy = true;

      const follow = Math.random() < BOT_FOLLOW_CHANCE;

      if (follow) {
        console.log("following human");
        botFollow();
      } else {
        botRandom();
      }
    }

    // newer botFollow that acts more intentional (clustering, symmetry, follow and fallback)
    function botFollow() {
      const { type, x, y } = lastHumanAction;
      const category = spriteSizes[type].c;

      if (type === 'path') {
        console.log(type);
        return botFollowPath();
      }

      const options = Object.keys(spriteSizes).filter(t => spriteSizes[t].c === category);
      const botType = options[Math.floor(Math.random() * options.length)];

      const best = findBestPosition(botType, x, y);

      if (best) {
        return moveBotCursorTo(best.x, best.y, 'place', botType, () => {
          placeSprite(botType, best.x, best.y, true);
        });
      }

      // fallback (rare)
      botRandom();
    }

    function botFollowPath() {
      console.log("reached botFollowPath");
      if (!currentPathDirection || !lastPathTile) {
        botBusy = false;
        return;
      }

      const dir = currentPathDirection;

      const nx = lastPathTile.x + dir.dx;
      const ny = lastPathTile.y + dir.dy;

      // bounds
      if (nx < 0 || ny < 0 || nx >= GRID_SIZE || ny >= GRID_SIZE) {
        botBusy = false;
        return;
      }

      // don't overwrite trees/bushes
      const blocked = placedSprites.some(p =>
        nx < p.x + p.w &&
        nx + 1 > p.x &&
        ny < p.y + p.h &&
        ny + 1 > p.y
      );

      if (blocked) {
        botBusy = false;
        return;
      }

      moveBotCursorTo(nx, ny, 'place', 'path', () => {
        placePath('path',nx, ny, true);
      });
    }

    function botRandom() {
      const doDelete = Math.random() < 0.5;

      if (doDelete && placedSprites.length > 0) {
        moveBotCursorTo(lastHumanAction.x, lastHumanAction.y, 'delete', null, () => {
          deleteSprite(lastHumanAction.x, lastHumanAction.y, true);
        });
        return;
      }

      const categories = [...new Set(Object.values(spriteSizes).map(s => s.c))];
      const randomCategory = categories[Math.floor(Math.random() * categories.length)];

      //const options = Object.keys(spriteSizes).filter(t => spriteSizes[t].c === randomCategory);
      const options = Object.keys(spriteSizes).filter(t => spriteSizes[t].c === randomCategory && t !== 'path');

      for (let i = 0; i < 10; i++) {
        const type = options[Math.floor(Math.random() * options.length)];
        const x = Math.floor(Math.random() * GRID_SIZE);
        const y = Math.floor(Math.random() * GRID_SIZE);

        if (canPlace(type, x, y)) {
          return moveBotCursorTo(x, y, 'place', type, () => {
            placeSprite(type, x, y, true);
          });
        }
      }

      botBusy = false;
    }

    function moveBotCursorTo(gridX, gridY, mode, type, callback) {
      if (mode === 'place' && !botPlaceReady) {
        // fallback: skip animation but still place
        if (callback) callback();
        botBusy = false;
        return;
      }
      const baseX = gridX * CELL_SIZE;
      const baseY = gridY * CELL_SIZE;

      // hide both first
      botPlaceCursor.visible(false);
      botDeleteCursor.visible(false);

      let cursor;

      if (mode === 'place') {
        cursor = botPlaceCursor;
      } else {
        cursor = botDeleteCursor;
      }

      // always 1 tile size
      cursor.width(CELL_SIZE);
      cursor.height(CELL_SIZE);

      // ---------- CURRENT POSITION (already initialized to center)
      const startX = cursor.x();
      const startY = cursor.y();

      // ---------- MISALIGNMENT (small offset)
      const offsetX = (Math.random() - 0.5) * 6; // -3 to +3 px
      const offsetY = (Math.random() - 0.5) * 6;

      const targetX = baseX + offsetX;
      const targetY = baseY + offsetY;

      cursor.scale({ x: 1, y: 1 });
      cursor.visible(true);

      // ---------- PRE-MOVE HESITATION ----------
      const preDelay = [80, 120, 160][Math.floor(Math.random() * 3)];

      setTimeout(() => {
        cursor.visible(true);
        // ---------- MOVE (slightly imperfect)
        cursor.to({
          x: targetX,
          y: targetY,
          duration: 0.35,
          easing: Konva.Easings.EaseInOut,
          onFinish: () => {

            // ---------- MICRO CORRECTION (snap into place)
            cursor.to({
              x: baseX,
              y: baseY,
              duration: 0.08,
              onFinish: () => {

                // ---------- HOVER DELAY ----------
                const hoverDelay = [120, 180, 250][Math.floor(Math.random() * 3)];

                setTimeout(() => {

                  // ---------- CLICK ----------
                  cursor.to({
                    scaleX: 0.8,
                    scaleY: 0.8,
                    duration: 0.08,
                    onFinish: () => {
                      cursor.to({
                        scaleX: 1,
                        scaleY: 1,
                        duration: 0.08,
                        onFinish: () => {

                          cursor.visible(false);

                          if (callback) callback();

                          botBusy = false;
                        }
                      });
                    }
                  });

                }, hoverDelay);
              }
            });

          }
        });

      }, preDelay);
    }

    // ---------- FIXED KONVA CLICK DETECTION ----------
    // Must set listening(true) and pointer-events must not be blocked
    bgLayer.listening(true);
    itemLayer.listening(true);
    stage.listening(true);

    stage.on('pointerdown', () => {
      const pos = stage.getPointerPosition();
      if (!pos) return; // safety

      const gridX = Math.floor(pos.x / CELL_SIZE);
      const gridY = Math.floor(pos.y / CELL_SIZE);

      // Tool: erase
      // if (selectedTool === 'erase') {
      //   deleteSprite(gridX, gridY);
      //   return;
      // }
      if (selectedTool === 'erase') {
        // try deleting path first
        if (pathTiles[key(gridX, gridY)]) {
          deletePath(gridX, gridY);
        } else {
          deleteSprite(gridX, gridY);
        }
        return;
      }

      // Tool: pick
      if (selectedTool === 'pick') {
        const existing = itemLayer.findOne(`#cell-${gridX}-${gridY}`);
        if (existing) {
          const src = existing.image().src;
          const type = Object.keys(spriteImages).find(t => spriteImages[t] === src);

          if (type) {
            clearSelectedUIitem();
            document.querySelector(`[data-type="${type}"]`).classList.add('selected');
            selectedType = type;
          }
        }
        return;
      }

      // Placement mode
      if (selectedType === 'path') {
        console.log("placing path");
        placePath(selectedType, gridX, gridY);
        return;
      }

      if (selectedType) {
        console.log("placing elements");
        deleteSprite(gridX, gridY);
        placeSprite(selectedType, gridX, gridY);
      }
    });

    function updateCursor() {
      const container = document.getElementById('stage-container');

      if (selectedTool === 'erase') {
        container.style.cursor = "url('assets/cursor-erase-human.png') 16 16, auto";
      } else {
        container.style.cursor = "url('assets/cursor-place-human.png') 16 16, auto";
      }
    }
  </script>
</body>
